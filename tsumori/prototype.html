<title>ガマンの塔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: phone-first single column. ホーム（貯金台帳＋1タップ記録）と 誘惑の塔 を切り替え、プレイは全画面の筐体。単一の暗い配色（ゲーム画面に合わせて意図的にダーク固定）。 */
:root{
  --ink:#0d1714; --ink2:#08100d; --panel:#14231e; --line:#26392f; --fg:#edf4ec; --dim:#93aa9c;
  --gold:#f2c14e; --gold2:#b8862a; --red:#ff5d5d; --cyan:#6fd3ff; --ok:#7be495; --warn:#ffb454;
  --display:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --pixel:"DotGothic16","Zen Kaku Gothic New",monospace;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;margin:0;letter-spacing:.04em}
h1 span{color:var(--gold)}
h2{font-family:var(--display);font-weight:400;font-size:15px;margin:0;letter-spacing:.06em;color:var(--dim)}
.tabs{display:flex;gap:6px;background:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:700;color:var(--dim)}
.tabs button[aria-current="true"]{background:var(--panel);color:var(--fg)}
.sec{display:flex;flex-direction:column;gap:10px}
.num{font-variant-numeric:tabular-nums}

/* 台帳カード */
.ledger{background:linear-gradient(180deg,var(--panel),var(--ink2));border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.total small{display:block;color:var(--dim);font-size:12px;letter-spacing:.08em}
.total b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums}
.lvrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lv{font-family:var(--pixel);font-size:28px;line-height:1}
.lv em{font-style:normal;font-size:14px;color:var(--dim);margin-right:2px}
.next{color:var(--dim);font-size:13px}
.bar{height:8px;background:var(--ink2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0;transition:width .4s}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 16px;font-size:13px}
.facts div{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:6px}
.facts span{color:var(--dim);white-space:nowrap}
.facts b{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.stat small{display:block;font-size:11px;color:var(--dim)}
.stat b{font-family:var(--pixel);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}

/* 記録 */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pre{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;min-width:0}
.pre span{min-width:0;overflow-wrap:anywhere;font-size:14px}
.pre b{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.pre:active{transform:scale(.97)}
.custom{display:flex;gap:8px;flex-wrap:wrap}
.custom input{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.custom #cName{flex:2 1 140px}
.custom #cAmt{flex:1 1 100px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241a04}
.btn.red{background:var(--red);border-color:var(--red);color:#2a0707}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--red);font-size:13px;min-height:1em;margin:0}

.log{display:flex;flex-direction:column;gap:6px}
.logday{font-size:12px;color:var(--dim);margin-top:6px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.item .nm{min-width:0;overflow-wrap:anywhere;font-size:14px}
.item .am{font-variant-numeric:tabular-nums;color:var(--gold)}
.item.cx{opacity:.5}
.item.cx .nm,.item.cx .am{text-decoration:line-through}
.item .undo{border:1px solid var(--line);background:none;border-radius:8px;padding:3px 8px;font-size:12px;color:var(--dim)}
.item .undo.arm{border-color:var(--red);color:var(--red)}
.empty{color:var(--dim);font-size:13px;border:1px dashed var(--line);border-radius:12px;padding:14px}

.debug{border:1px dashed var(--warn);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.debug h2{color:var(--warn)}
.debug p{margin:0;font-size:12px;color:var(--dim)}

/* 塔 */
.floors{display:flex;flex-direction:column;gap:6px}
.floor{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.floor:disabled{opacity:.35;cursor:not-allowed}
.floor .fl{font-family:var(--pixel);font-size:20px;font-variant-numeric:tabular-nums}
.floor .bn{min-width:0;overflow-wrap:anywhere;font-size:14px}
.floor .bn small{display:block;color:var(--dim);font-size:12px}
.chip{font-size:12px;border-radius:99px;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok)} .chip.mid{color:var(--warn)} .chip.hard{color:var(--red)} .chip.done{color:var(--gold)}

/* プレイ */
#play{position:fixed;inset:0;background:var(--ink2);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{display:block;touch-action:none;border-radius:8px}
.phud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 10px);display:flex;gap:8px}
#bombBtn{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);right:calc(env(safe-area-inset-right,0px) + 18px);width:76px;height:76px;border-radius:50%;border:2px solid var(--cyan);background:rgba(111,211,255,.15);color:var(--cyan);font-family:var(--pixel);font-size:15px}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,10,8,.78);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.rbox h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.rbox p{margin:0;color:var(--dim);font-size:14px}
.rbox .need{background:var(--ink2);border:1px solid var(--gold2);border-radius:12px;padding:12px;color:var(--fg)}
.rbox .need b{color:var(--gold);font-family:var(--display);font-weight:400;font-size:22px;display:block}
.rbox .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--gold);color:#241a04;font-weight:700;border-radius:12px;padding:10px 16px;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.big{font-family:var(--display);font-weight:400;font-size:18px}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .25s ease-out}@keyframes pop{from{transform:translate(-50%,12px);opacity:0}}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <h1>ガマンの<span>塔</span></h1>
    <nav class="tabs" aria-label="画面">
      <button id="tabHome" aria-current="true">ホーム</button>
      <button id="tabTower" aria-current="false">誘惑の塔</button>
    </nav>
  </header>

  <section id="home" class="sec" style="gap:22px">
    <div class="ledger">
      <div class="total"><small>累計つもり貯金</small><b id="vTotal" class="num">¥0</b></div>
      <div class="lvrow"><span class="lv"><em>Lv</em><span id="vLv">0</span></span><span class="next" id="vNext"></span></div>
      <div class="bar" aria-hidden="true"><i id="vBar"></i></div>
      <div class="facts">
        <div><span>今日の反映</span><b id="vToday">¥0 / ¥3,000</b></div>
        <div><span>繰り越し</span><b id="vCarry">¥0</b></div>
        <div><span>連続</span><b id="vStreak">0日</b></div>
        <div><span>おやすみ券</span><b id="vTicket">0枚</b></div>
      </div>
      <div class="stats">
        <div class="stat"><small>火力/秒</small><b id="sDps">10</b></div>
        <div class="stat"><small>ショット</small><b id="sWay">1列</b></div>
        <div class="stat"><small>ボム</small><b id="sBomb">1</b></div>
        <div class="stat"><small>残機</small><b id="sLife">0</b></div>
      </div>
    </div>

    <div class="sec">
      <h2>今日ガマンしたもの（押すと記録）</h2>
      <div class="presets" id="presets"></div>
      <form class="custom" id="customForm" autocomplete="off">
        <input id="cName" maxlength="20" placeholder="品名（なくてもOK）" aria-label="品名">
        <input id="cAmt" inputmode="numeric" placeholder="金額" aria-label="金額（円）">
        <button class="btn gold" type="submit">記録</button>
      </form>
      <p class="err" id="cErr"></p>
    </div>

    <div class="sec">
      <h2>履歴</h2>
      <div class="log" id="log"></div>
    </div>

    <div class="debug">
      <h2>試作用：日付を進める</h2>
      <p id="vDay"></p>
      <div class="custom">
        <button class="btn small" id="dNext">次の日へ（記録なし）</button>
        <button class="btn small" id="d7">7日進める（毎日¥500）</button>
        <button class="btn small" id="d30">30日進める（毎日¥500）</button>
        <button class="btn small" id="dReset">全部消す</button>
      </div>
      <p>この試作の記録は、このブラウザの中にだけ保存されます。</p>
    </div>
  </section>

  <section id="tower" class="sec" hidden>
    <h2>誘惑の塔</h2>
    <p id="tInfo" class="num" style="margin:0;color:var(--dim);font-size:13px"></p>
    <div class="floors" id="floors"></div>
  </section>
</div>

<div id="play" hidden>
  <canvas id="cv" width="360" height="540"></canvas>
  <div class="phud"><button class="btn small" id="quitBtn">やめる</button></div>
  <button id="bombBtn" aria-label="ボムを使う">BOMB<br><span id="bombN">1</span></button>
  <div id="result" hidden><div class="rbox" id="rbox"></div></div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');

/* ===== 計算（仕様書 4章）。記録の一覧と今日の日付だけから決まる ===== */
const CAP=3000, ROLL_H=4, MAX_LV=99;
const needFor=L=>30*L*L+70*L;
function lvOf(r){if(r<=0)return 0;return Math.min(MAX_LV,Math.floor((-70+Math.sqrt(4900+120*r))/60))}
function dps(L){return 10*Math.pow(1.04,L)}
function ways(L){return 1+(L>=10)+(L>=25)+(L>=45)+(L>=70)}
function interval(L){return .10-.04*L/99}
function bombs(streak){return Math.min(4,1+Math.floor(streak/3))}
function lives(streak){return (streak>=7)+(streak>=30)}
const isMonday=d=>((d%7)+7)%7===4; // 通し番号0 = 1970-01-01（木）
function realDay(){const t=new Date(Date.now()-ROLL_H*3600e3);return Math.round(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/864e5)}
function dayLabel(d){const t=new Date(d*864e5);const w='日月火水木金土'[t.getUTCDay()];return `${t.getUTCMonth()+1}月${t.getUTCDate()}日（${w}）`}

function derive(entries,today){
  const byDay=new Map(), cnt=new Map();let total=0;
  for(const e of entries){if(e.cx)continue;total+=e.amount;byDay.set(e.day,(byDay.get(e.day)||0)+e.amount);cnt.set(e.day,(cnt.get(e.day)||0)+1)}
  const out={total,refl:0,carry:0,todayRefl:0,streak:0,tickets:0};
  if(!byDay.size)return fin(out);
  const start=Math.min(...byDay.keys());
  let carry=0,refl=0,streak=0,tickets=0;
  for(let d=start;d<=today;d++){
    if(d===start||isMonday(d))tickets=Math.min(2,tickets+1);
    const avail=carry+(byDay.get(d)||0),r=Math.min(CAP,avail);
    refl+=r;carry=avail-r;if(d===today)out.todayRefl=r;
    if(cnt.get(d))streak++;
    else if(d<today){if(streak>0&&tickets>0)tickets--;else streak=0}
  }
  Object.assign(out,{refl,carry,streak,tickets});
  return fin(out);
}
function fin(o){o.lv=lvOf(o.refl);o.dps=dps(o.lv);o.ways=ways(o.lv);o.bombs=bombs(o.streak);o.lives=lives(o.streak);return o}
// 推奨Lvに届くまでの額と最短日数（上限・繰り越し込み）
function needInfo(st,rec){const need=Math.max(0,needFor(rec)-st.refl);if(!need)return null;const todayRoom=CAP-st.todayRefl;const fromCarry=Math.max(0,need-todayRoom);const days=need<=todayRoom?0:Math.ceil(fromCarry/CAP);return{need,more:Math.max(0,need-st.carry),days}}

/* ===== 保存（試作なのでブラウザ内だけ） ===== */
const KEY='gaman-tower-proto-v1';
const PRESETS=[['コンビニコーヒー',150],['ペットボトル飲料',160],['コンビニおやつ',200],['カフェのドリンク',550],['ランチの外食',1000],['タクシー',1500],['飲み会の2次会',3000],['トレカ 1パック',180],['トレカ 1BOX',5500],['ネットのついで買い',2000]];
function blank(){return{entries:[],offset:0,cleared:0,best:{},seq:0}}
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>realDay()+S.offset;
const state=()=>derive(S.entries,today());

/* ===== ホーム ===== */
let toastT;
function toast(msg,big){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast'+(big?' big':'');t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),big?2600:1800)}

function record(name,amount){
  const before=state(),day=today();
  if(S.entries.filter(e=>e.day===day&&!e.cx).length>=30){toast('1日に記録できるのは30件までです');return}
  S.entries.push({id:++S.seq,day,name:name||'その他',amount,cx:false});save();
  const after=state();renderHome();
  if(after.lv>before.lv){
    const up=after.ways>before.ways?`　${after.ways}列ショット解放！`:'';
    toast(`Lv${before.lv} → ${after.lv}！ 火力 ${Math.round(before.dps)} → ${Math.round(after.dps)}${up}`,true);
  }else if(after.lv>=MAX_LV){toast(`${yen(amount)} 記録しました`)}
  else{
    const rest=needFor(after.lv+1)-after.refl;
    toast(after.refl===before.refl?`${yen(amount)} は繰り越し（今日の反映は上限）`:`${yen(amount)} 記録。次のLvまで あと${yen(rest)}`);
  }
}
function renderPresets(){
  const box=$('presets');box.innerHTML='';
  for(const [n,a] of PRESETS){const b=document.createElement('button');b.className='pre';b.innerHTML=`<span></span><b>${yen(a)}</b>`;b.firstChild.textContent=n;b.onclick=()=>record(n,a);box.appendChild(b)}
}
$('customForm').addEventListener('submit',e=>{
  e.preventDefault();const raw=$('cAmt').value.replace(/[,，¥円\s]/g,'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const a=Number(raw);
  if(!/^\d+$/.test(raw)||a<10||a>100000){$('cErr').textContent='金額は ¥10〜¥100,000 の整数で入れてください';return}
  $('cErr').textContent='';record($('cName').value.trim().slice(0,20),a);$('cName').value='';$('cAmt').value='';
});

let armed=null;
function renderLog(){
  const box=$('log');box.innerHTML='';
  if(!S.entries.length){box.innerHTML='<div class="empty">まだ記録がありません。上のボタンを押すと、その金額で記録されてすぐに強くなります。</div>';return}
  const list=[...S.entries].reverse().slice(0,40);let lastDay=null;
  for(const e of list){
    if(e.day!==lastDay){const h=document.createElement('div');h.className='logday';h.textContent=dayLabel(e.day)+(e.day===today()?'　今日':'');box.appendChild(h);lastDay=e.day}
    const r=document.createElement('div');r.className='item'+(e.cx?' cx':'');
    r.innerHTML='<span class="nm"></span><span class="am"></span>';r.children[0].textContent=e.name;r.children[1].textContent=yen(e.amount);
    if(e.cx){const s=document.createElement('span');s.className='undo';s.textContent='取り消し済み';r.appendChild(s)}
    else{const b=document.createElement('button');b.className='undo'+(armed===e.id?' arm':'');b.textContent=armed===e.id?'本当に取り消す':'やっぱり買った';
      b.onclick=()=>{if(armed!==e.id){armed=e.id;renderLog();return}armed=null;const before=state();e.cx=true;save();const after=state();renderHome();toast(after.lv<before.lv?`取り消しました（Lv${before.lv} → ${after.lv}）`:'取り消しました')};r.appendChild(b)}
    box.appendChild(r);
  }
}
function renderHome(){
  const st=state();
  $('vTotal').textContent=yen(st.total);$('vLv').textContent=st.lv;
  if(st.lv>=MAX_LV){$('vNext').textContent='最大レベル';$('vBar').style.width='100%'}
  else{const a=needFor(st.lv),b=needFor(st.lv+1);$('vNext').textContent=`次のLvまで あと${yen(b-st.refl)}`;$('vBar').style.width=((st.refl-a)/(b-a)*100).toFixed(1)+'%'}
  $('vToday').textContent=`${yen(st.todayRefl)} / ${yen(CAP)}`;
  $('vCarry').textContent=st.carry?`${yen(st.carry)}（明日以降）`:'¥0';
  $('vStreak').textContent=st.streak+'日';$('vTicket').textContent=st.tickets+'枚';
  $('sDps').textContent=Math.round(st.dps);$('sWay').textContent=st.ways+'列';$('sBomb').textContent=st.bombs;$('sLife').textContent=st.lives;
  $('vDay').textContent=`いまの日付：${dayLabel(today())}${S.offset?`（本当の今日から ${S.offset}日後）`:''}`;
  renderLog();
}
$('dNext').onclick=()=>{S.offset++;save();renderHome();toast(dayLabel(today())+' になりました')};
function sim(n){for(let i=0;i<n;i++){S.offset++;S.entries.push({id:++S.seq,day:today(),name:'まとめて記録（試作）',amount:500,cx:false})}save();renderHome();const st=state();toast(`${n}日進めました　Lv${st.lv}`,true)}
$('d7').onclick=()=>sim(7);$('d30').onclick=()=>sim(30);
let resetArm=false;
$('dReset').onclick=()=>{if(!resetArm){resetArm=true;$('dReset').textContent='本当に全部消す';$('dReset').classList.add('red');return}S=blank();save();resetArm=false;$('dReset').textContent='全部消す';$('dReset').classList.remove('red');renderHome();toast('全部消しました')};

/* ===== 塔（仕様書 5章） ===== */
const BOSSES=['コンビニの誘惑','自販機の誘惑','カフェの誘惑','サブスクの誘惑','タイムセールの誘惑','送料無料まであと少しの誘惑','限定品の誘惑','新作パックの誘惑','推しグッズの誘惑','衝動買いの化身'];
const bossName=f=>f===100?'衝動買いの化身・真':`${BOSSES[Math.floor((f-1)/10)]} ${(f-1)%10+1}`;
const recLv=f=>f-1;
const bossHp=f=>Math.round(20*dps(recLv(f)));
function renderTower(){
  const st=state(),box=$('floors');box.innerHTML='';
  $('tInfo').textContent=`クリア ${S.cleared} / 100階　あなたは Lv${st.lv}`;
  const top=Math.min(100,S.cleared+1);
  for(let f=top;f>=1;f--){
    const b=document.createElement('button');b.className='floor';
    const gap=st.lv-recLv(f),done=f<=S.cleared;
    const chip=done?['done','クリア']:gap>=0?['ok','余裕']:gap>=-5?['mid','適正']:['hard','きつい'];
    b.innerHTML=`<span class="fl">${f}F</span><span class="bn"><span></span><small>推奨Lv${recLv(f)}・HP ${bossHp(f).toLocaleString()}${S.best[f]?`・最速 ${S.best[f].toFixed(1)}秒`:''}</small></span><span class="chip ${chip[0]}">${chip[1]}</span>`;
    b.querySelector('.bn span').textContent=bossName(f);
    b.onclick=()=>startGame(f);box.appendChild(b);
  }
  if(top<100){const l=document.createElement('button');l.className='floor';l.disabled=true;l.innerHTML=`<span class="fl">${top+1}F</span><span class="bn">？？？<small>${top}階をクリアすると開きます</small></span><span></span>`;box.prepend(l)}
}
function tab(which){$('home').hidden=which!=='home';$('tower').hidden=which!=='tower';$('tabHome').setAttribute('aria-current',which==='home');$('tabTower').setAttribute('aria-current',which==='tower');if(which==='tower')renderTower();else renderHome();window.scrollTo(0,0)}
$('tabHome').onclick=()=>tab('home');$('tabTower').onclick=()=>tab('tower');

/* ===== ボスの弾幕（階から決定的に生成） ===== */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const lerp=(a,b,t)=>a+(b-a)*t;
const COLS=['#ff5d5d','#f2c14e','#c58bff','#6fd3ff','#7be495'];
function genFloor(f){
  const rng=mulberry(hash('floor'+f)),t=(f-1)/99,phases=[];
  for(let p=1;p<=3;p++){
    const n=1+(p===2&&f>=30)+(p===3&&f>=15)+(p===3&&f>=60);
    const pool=p===1?['radial','aimed','swing']:['radial','aimed','spiral','rain','swing'];
    const ems=[];
    for(let k=0;k<n;k++){
      const type=pool[Math.floor(rng()*pool.length)],dens=1/Math.sqrt(n);
      const v=lerp(95,175,t)*(.9+.2*rng());
      let e={type,v,col:COLS[(p+k+Math.floor(rng()*2))%5],rot:0,ph:rng()*6.28};
      if(type==='radial')Object.assign(e,{i:lerp(.95,.42,t)/dens,c:Math.round(lerp(10,22,t)*dens),r:.17+.1*rng()});
      if(type==='spiral')Object.assign(e,{i:lerp(.11,.055,t)/dens,c:Math.round(lerp(2,4,t)),r:.21+.08*rng()});
      if(type==='aimed')Object.assign(e,{i:lerp(.85,.38,t)/dens,c:Math.round(lerp(3,7,t)),r:lerp(.5,.85,t)});
      if(type==='rain')Object.assign(e,{i:lerp(.16,.06,t)/dens,c:1});
      if(type==='swing')Object.assign(e,{i:lerp(.5,.22,t)/dens,c:Math.round(lerp(5,9,t)),r:.9});
      ems.push(e);
    }
    phases.push(ems);
  }
  return phases;
}

/* ===== プレイ ===== */
const W=360,H=540,DT=1/120,HIT=5.5,LIMIT=60,READY=1.2;
const cv=$('cv'),cx=cv.getContext('2d');
let G=null,raf=0,acc=0,last=0;
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1);const s=Math.min((innerWidth-8)/W,(innerHeight-8)/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);G&&(G.scale=s)}
addEventListener('resize',()=>{if(G)resize()});
function startGame(f){
  const st=state();
  G={f,st,phases:genFloor(f),t:-READY,hp:bossHp(f),maxHp:bossHp(f),phase:1,pause:0,
     px:W/2,py:H-80,bul:[],shots:[],cool:0,bombs:st.bombs,lives:st.lives,inv:0,flash:0,
     cools:[],stars:Array.from({length:40},(_,i)=>({x:(i*97)%W,y:(i*53)%H,s:.4+((i*31)%10)/10})),over:false,keys:{}};
  G.pw=st.dps*interval(st.lv)/st.ways;G.iv=interval(st.lv);G.wy=st.ways;
  G.cools=G.phases.map(ems=>ems.map((e,k)=>k*.2));
  $('play').hidden=false;$('result').hidden=true;$('bombN').textContent=G.bombs;resize();
  last=performance.now();acc=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function loop(now){if(!G)return;acc+=Math.min(.1,(now-last)/1000);last=now;while(acc>=DT){if(!G.over)step(DT);acc-=DT}draw();raf=requestAnimationFrame(loop)}
function bossPos(){const t=Math.max(0,G.t),a=lerp(.15,.25,(G.f-1)/99),w=lerp(.45,.75,(G.f-1)/99);return{x:W*(.5+a*Math.sin(t*w)),y:92+10*Math.sin(t*1.7)}}
function phaseOf(){const r=G.hp/G.maxHp;return r>2/3?1:r>1/3?2:3}
function fire(e,bx,by,rng){
  const add=(a,v)=>{if(G.bul.length<900)G.bul.push({x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v,col:e.col})};
  if(e.type==='radial'||e.type==='spiral'){for(let k=0;k<e.c;k++)add(e.rot+k*6.283/e.c,e.v);e.rot+=e.r}
  else if(e.type==='aimed'){const base=Math.atan2(G.py-by,G.px-bx);for(let k=0;k<e.c;k++)add(base+(e.c>1?(k/(e.c-1)-.5)*e.r:0),e.v)}
  else if(e.type==='rain'){if(G.bul.length<900)G.bul.push({x:Math.random()*W,y:-6,vx:0,vy:e.v*(.8+.4*Math.random()),col:e.col})}
  else if(e.type==='swing'){const base=Math.PI/2+Math.sin(G.t*1.3+e.ph)*.7;for(let k=0;k<e.c;k++)add(base+(k/(e.c-1)-.5)*e.r,e.v)}
}
function clearBullets(){G.bul.length=0}
function step(dt){
  G.t+=dt;
  // 移動（キーボード）
  const k=G.keys,sp=(k.Shift?90:200)*dt;
  if(k.ArrowLeft)G.px-=sp;if(k.ArrowRight)G.px+=sp;if(k.ArrowUp)G.py-=sp;if(k.ArrowDown)G.py+=sp;
  G.px=Math.max(8,Math.min(W-8,G.px));G.py=Math.max(8,Math.min(H-8,G.py));
  if(G.inv>0)G.inv-=dt;if(G.flash>0)G.flash-=dt;
  if(G.t<0)return;
  if(G.t>=LIMIT)return finish(false,'時間切れ');
  const b=bossPos();
  // 自機ショット
  G.cool-=dt;
  if(G.cool<=0){G.cool+=G.iv;for(let i=0;i<G.wy;i++){const a=-Math.PI/2+(i-(G.wy-1)/2)*.026;G.shots.push({x:G.px,y:G.py-10,vx:Math.cos(a)*960,vy:Math.sin(a)*960})}}
  for(let i=G.shots.length-1;i>=0;i--){const s=G.shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;
    if((s.x-b.x)**2+(s.y-b.y)**2<29*29){G.shots.splice(i,1);G.hp-=G.pw;G.flash=.05}else if(s.y<-10)G.shots.splice(i,1)}
  if(G.hp<=0){G.hp=0;return finish(true)}
  const ph=phaseOf();
  if(ph!==G.phase){G.phase=ph;clearBullets();G.pause=1.0}
  if(G.pause>0){G.pause-=dt}
  else{const ems=G.phases[G.phase-1],cs=G.cools[G.phase-1];
    for(let i=0;i<ems.length;i++){cs[i]-=dt;if(cs[i]<=0){cs[i]+=ems[i].i;fire(ems[i],b.x,b.y)}}}
  // 敵弾
  for(let i=G.bul.length-1;i>=0;i--){const o=G.bul[i];o.x+=o.vx*dt;o.y+=o.vy*dt;
    if(o.x<-12||o.x>W+12||o.y<-12||o.y>H+12){G.bul.splice(i,1);continue}
    if(G.inv<=0&&(o.x-G.px)**2+(o.y-G.py)**2<HIT*HIT){
      if(G.lives>0){G.lives--;clearBullets();G.inv=1.5;break}
      return finish(false,'被弾')}}
}
function useBomb(){if(!G||G.over||G.t<0||G.bombs<=0)return;G.bombs--;clearBullets();G.inv=1.5;$('bombN').textContent=G.bombs}
$('bombBtn').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();useBomb()});
// ドラッグで相対移動（倍率1.2）
let drag=null;
$('play').addEventListener('pointerdown',e=>{if(!G||e.target.closest('button,#result'))return;drag={x:e.clientX,y:e.clientY};e.preventDefault()});
addEventListener('pointermove',e=>{if(!drag||!G)return;const s=G.scale||1;G.px+=(e.clientX-drag.x)/s*1.2;G.py+=(e.clientY-drag.y)/s*1.2;drag={x:e.clientX,y:e.clientY};G.px=Math.max(8,Math.min(W-8,G.px));G.py=Math.max(8,Math.min(H-8,G.py))});
addEventListener('pointerup',()=>drag=null);addEventListener('pointercancel',()=>drag=null);
addEventListener('keydown',e=>{if(!G)return;if(e.key.startsWith('Arrow')){G.keys[e.key]=true;e.preventDefault()}if(e.key==='Shift')G.keys.Shift=true;if(e.key==='x'||e.key==='X'||e.key===' '){useBomb();e.preventDefault()}});
addEventListener('keyup',e=>{if(!G)return;G.keys[e.key]=false;if(e.key==='Shift')G.keys.Shift=false});

function finish(win,why){
  G.over=true;const f=G.f,st=state(),rec=recLv(f),box=$('rbox');
  if(win){
    const first=f>S.cleared;if(first)S.cleared=f;if(!S.best[f]||G.t<S.best[f])S.best[f]=G.t;save();
    box.innerHTML=`<h3 style="color:var(--gold)">${f}F クリア！</h3><p></p><p>${G.t.toFixed(1)}秒で撃破${S.best[f]===G.t?'（最速）':''}</p><div class="row">${f<100?'<button class="btn gold" id="rNext">次の階へ</button>':''}<button class="btn" id="rBack">塔に戻る</button></div>`;
    box.children[1].textContent=`「${bossName(f)}」に勝ちました`;
    if(f===100)box.children[1].textContent='衝動買いの化身を倒しました。塔の頂上です';
    $('rNext')&&($('rNext').onclick=()=>startGame(f+1));
  }else{
    const pct=Math.ceil(G.hp/G.maxHp*100);
    const n=needInfo(st,rec);
    let needHtml='';
    if(n){const when=n.days===0?'今日中に届きます':`最短 ${n.days}日後（1日の反映は${yen(CAP)}まで）`;
      needHtml=`<div class="need">推奨 Lv${rec} まで<b>あと ${yen(n.more)} のガマン</b><span style="font-size:13px;color:var(--dim)">${n.more<n.need?`繰り越し ${yen(n.need-n.more)} を含めると反映まで ${yen(n.need)}。`:''}${when}</span></div>`}
    else needHtml=`<p>推奨レベルには届いています。弾をよく見て、もう一度！</p>`;
    box.innerHTML=`<h3 style="color:var(--red)">${why==='被弾'?'被弾…':'時間切れ…'}</h3><p>ボスの残りHP ${pct}%</p>${needHtml}<div class="row"><button class="btn gold" id="rRetry">もう一度</button><button class="btn" id="rRec">ガマンを記録</button><button class="btn" id="rBack">塔に戻る</button></div>`;
    $('rRetry').onclick=()=>startGame(f);
    $('rRec').onclick=()=>{leave();tab('home')};
  }
  $('rBack').onclick=()=>{leave();tab('tower')};
  $('result').hidden=false;
}
function leave(){cancelAnimationFrame(raf);G=null;$('play').hidden=true}
$('quitBtn').onclick=()=>{leave();tab('tower')};

function draw(){
  const c=cx;c.fillStyle='#08100d';c.fillRect(0,0,W,H);
  for(const s of G.stars){s.y+=s.s*.6;if(s.y>H)s.y=0;c.fillStyle=`rgba(237,244,236,${.15+s.s*.2})`;c.fillRect(s.x,s.y,1.5,1.5)}
  const b=bossPos();
  // ボス（値札の形）
  c.save();c.translate(b.x,b.y);c.rotate(Math.sin(Math.max(0,G.t)*2)*.08);
  c.fillStyle=G.flash>0?'#ffffff':'#ff5d5d';c.beginPath();c.moveTo(-26,-18);c.lineTo(14,-18);c.lineTo(30,0);c.lineTo(14,18);c.lineTo(-26,18);c.closePath();c.fill();
  c.fillStyle='#08100d';c.beginPath();c.arc(14,0,4,0,7);c.fill();
  c.fillStyle='#2a0707';c.font="bold 20px sans-serif";c.textAlign="center";c.textBaseline="middle";c.fillText("¥",-7,1);c.restore();
  // 自機ショット
  c.fillStyle='#f2c14e';for(const s of G.shots)c.fillRect(s.x-1.5,s.y-6,3,10);
  // 自機
  if(!(G.inv>0&&Math.floor(G.inv*20)%2)){const x=G.px,y=G.py;c.fillStyle='#6fd3ff';c.beginPath();c.moveTo(x,y-12);c.lineTo(x+9,y+9);c.lineTo(x,y+4);c.lineTo(x-9,y+9);c.closePath();c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x,y,2.5,0,7);c.fill()}
  // 敵弾
  for(const o of G.bul){c.fillStyle=o.col;c.beginPath();c.arc(o.x,o.y,6,0,7);c.fill()}
  c.fillStyle='#fff';for(const o of G.bul){c.beginPath();c.arc(o.x,o.y,2.8,0,7);c.fill()}
  // HUD
  c.textAlign='left';c.textBaseline='alphabetic';
  c.fillStyle='rgba(8,16,13,.7)';c.fillRect(0,0,W,44);
  c.fillStyle='#edf4ec';c.font='12px "DotGothic16",monospace';c.fillText(`${G.f}F ${bossName(G.f)}`,10,16);
  c.textAlign='right';c.fillText(`残り ${Math.max(0,LIMIT-Math.max(0,G.t)).toFixed(1)}秒`,W-10,16);
  c.fillStyle='#26392f';c.fillRect(10,24,W-20,8);
  c.fillStyle='#ff5d5d';c.fillRect(10,24,(W-20)*G.hp/G.maxHp,8);
  c.fillStyle='#08100d';for(const r of [1/3,2/3])c.fillRect(10+(W-20)*r-1,24,2,8);
  c.textAlign='left';c.fillStyle='#93aa9c';c.font='12px "DotGothic16",monospace';
  c.fillText(`Lv${G.st.lv}　火力${Math.round(G.st.dps)}　残機${G.lives}　ボム${G.bombs}`,10,H-12);
  if(G.t<0){c.textAlign='center';c.fillStyle='#f2c14e';c.font='28px "Dela Gothic One",sans-serif';c.fillText('READY',W/2,H/2)}
  else if(G.pause>0){c.textAlign='center';c.fillStyle='#f2c14e';c.font='22px "Dela Gothic One",sans-serif';c.fillText(`第${G.phase}段階`,W/2,H/2)}
}

renderPresets();
// 初めて開いたときは、何ができるか分かるように例の記録を入れておく
if(!S.entries.length&&!S.offset){
  try{if(!localStorage.getItem(KEY+'-seeded')){const d=today();S.entries.push({id:++S.seq,day:d-2,name:'コンビニコーヒー（例）',amount:150,cx:false},{id:++S.seq,day:d-1,name:'ランチの外食（例）',amount:1000,cx:false},{id:++S.seq,day:d,name:'トレカ 1BOX（例）',amount:5500,cx:false});save();localStorage.setItem(KEY+'-seeded','1')}}catch(e){}
}
renderHome();
</script>
