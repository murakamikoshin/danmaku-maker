<title>ガマンの塔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: phone-first single column. ホーム（貯金台帳＋1タップ記録）と 誘惑の塔 を切り替え、戦う前の確認と戦闘は全画面の重ね画面。単一の暗い配色（ゲームとして意図的にダーク固定）。 */
:root{
  --ink:#0d1714; --ink2:#08100d; --panel:#14231e; --line:#26392f; --fg:#edf4ec; --dim:#93aa9c;
  --gold:#f2c14e; --gold2:#b8862a; --red:#ff5d5d; --cyan:#6fd3ff; --ok:#7be495; --warn:#ffb454;
  --display:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --pixel:"DotGothic16","Zen Kaku Gothic New",monospace;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;margin:0;letter-spacing:.04em}
h1 span{color:var(--gold)}
h2{font-family:var(--display);font-weight:400;font-size:15px;margin:0;letter-spacing:.06em;color:var(--dim)}
.tabs{display:flex;gap:6px;background:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:700;color:var(--dim)}
.tabs button[aria-current="true"]{background:var(--panel);color:var(--fg)}
.sec{display:flex;flex-direction:column;gap:10px}
.num{font-variant-numeric:tabular-nums}
.note{margin:0;color:var(--dim);font-size:13px}

/* 台帳カード */
.ledger{background:linear-gradient(180deg,var(--panel),var(--ink2));border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.total small{display:block;color:var(--dim);font-size:12px;letter-spacing:.08em}
.total b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums}
.lvrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lv{font-family:var(--pixel);font-size:28px;line-height:1}
.lv em{font-style:normal;font-size:14px;color:var(--dim);margin-right:2px}
.next{color:var(--dim);font-size:13px}
.bar{height:8px;background:var(--ink2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0;transition:width .4s}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 16px;font-size:13px}
.facts div{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:6px}
.facts span{color:var(--dim);white-space:nowrap}
.facts b{font-variant-numeric:tabular-nums;text-align:right}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
.stat small{display:block;font-size:11px;color:var(--dim)}
.stat b{font-family:var(--pixel);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums;display:block;overflow-wrap:anywhere;line-height:1.3}
.stat b.sm{font-family:var(--body);font-weight:700;font-size:13px;padding-top:3px}

/* 記録 */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pre{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;min-width:0}
.pre span{min-width:0;overflow-wrap:anywhere;font-size:14px}
.pre b{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.pre:active{transform:scale(.97)}
.custom{display:flex;gap:8px;flex-wrap:wrap}
.custom input{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.custom #cName{flex:2 1 140px}
.custom #cAmt{flex:1 1 100px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241a04}
.btn.red{background:var(--red);border-color:var(--red);color:#2a0707}
.btn.small{padding:5px 10px;font-size:13px}
.btn.big{padding:13px 18px;font-size:17px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--red);font-size:13px;min-height:1em;margin:0}

.log{display:flex;flex-direction:column;gap:6px}
.logday{font-size:12px;color:var(--dim);margin-top:6px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.item .nm{min-width:0;overflow-wrap:anywhere;font-size:14px}
.item .am{font-variant-numeric:tabular-nums;color:var(--gold)}
.item.cx{opacity:.5}
.item.cx .nm,.item.cx .am{text-decoration:line-through}
.item .undo{border:1px solid var(--line);background:none;border-radius:8px;padding:3px 8px;font-size:12px;color:var(--dim)}
.item .undo.arm{border-color:var(--red);color:var(--red)}
.empty{color:var(--dim);font-size:13px;border:1px dashed var(--line);border-radius:12px;padding:14px}

.debug{border:1px dashed var(--warn);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.debug h2{color:var(--warn)}
.debug p{margin:0;font-size:12px;color:var(--dim)}

/* 塔 */
.floors{display:flex;flex-direction:column;gap:6px}
.floor{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.floor:disabled{opacity:.4;cursor:not-allowed}
.floor .fl{font-family:var(--pixel);font-size:20px;font-variant-numeric:tabular-nums}
.floor .bn{min-width:0;overflow-wrap:anywhere;font-size:14px}
.floor .bn small{display:block;color:var(--dim);font-size:12px}
.chip{font-size:12px;border-radius:99px;padding:2px 8px;border:1px solid currentColor;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.ok{color:var(--ok)} .chip.mid{color:var(--warn)} .chip.hard{color:var(--red)} .chip.done{color:var(--gold)} .chip.lock{color:var(--dim)}

/* 重ね画面（戦う前・戦闘・結果） */
.layer{position:fixed;inset:0;z-index:50;background:var(--ink2);overflow-y:auto;padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbox{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lhead .fl{font-family:var(--pixel);font-size:16px;color:var(--dim)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fighter{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;position:relative;min-width:0}
.fighter .nm{font-weight:700;font-size:14px;overflow-wrap:anywhere;line-height:1.35}
.fighter dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:13px;width:100%}
.fighter dt{color:var(--dim);text-align:left}
.fighter dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sprite{width:84px;height:84px;display:block}
.hp{width:100%;height:10px;background:var(--ink2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.hp i{display:block;height:100%;width:100%;transition:width .25s}
.hp.me i{background:var(--ok)} .hp.foe i{background:var(--red)}
.hpn{font-family:var(--pixel);font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.skills{display:flex;gap:6px;flex-wrap:wrap}
.skill{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px;text-align:left;font-size:13px;flex:1 1 140px;min-width:0}
.skill b{display:block;font-size:14px}
.skill span{color:var(--dim);font-size:12px}
.skill[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.skill:disabled{opacity:.35;cursor:not-allowed}
.odds{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:center}
.odds .pct{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.1;font-variant-numeric:tabular-nums}
.odds .hint{background:var(--ink2);border:1px solid var(--gold2);border-radius:10px;padding:10px;font-size:14px}
.odds .hint b{color:var(--gold)}
.blog{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;height:150px;overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:2px}
.blog .crit{color:var(--gold);font-weight:700}
.blog .foe{color:#ffb3b3}
.pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:24px;pointer-events:none;text-shadow:0 2px 0 var(--ink2)}
.pop.crit{color:var(--gold);font-size:32px}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:float .7s ease-out forwards}
  @keyframes float{from{opacity:1;transform:translate(-50%,-30%)}to{opacity:0;transform:translate(-50%,-140%)}}
  .hit{animation:shake .25s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.res{display:flex;flex-direction:column;gap:12px;text-align:center}
.res h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.res p{margin:0;color:var(--dim)}
.res .need{background:var(--panel);border:1px solid var(--gold2);border-radius:12px;padding:12px;color:var(--fg)}
.res .need b{color:var(--gold);font-family:var(--display);font-weight:400;font-size:22px;display:block}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--gold);color:#241a04;font-weight:700;border-radius:12px;padding:10px 16px;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.big{font-family:var(--display);font-weight:400;font-size:18px}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .25s ease-out}@keyframes pop{from{transform:translate(-50%,12px);opacity:0}}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <h1>ガマンの<span>塔</span></h1>
    <nav class="tabs" aria-label="画面">
      <button id="tabHome" aria-current="true">ホーム</button>
      <button id="tabTower" aria-current="false">誘惑の塔</button>
    </nav>
  </header>

  <section id="home" class="sec" style="gap:22px">
    <div class="ledger">
      <div class="total"><small>累計つもり貯金</small><b id="vTotal" class="num">¥0</b></div>
      <div class="lvrow"><span class="lv"><em>Lv</em><span id="vLv">0</span></span><span class="next" id="vNext"></span></div>
      <div class="bar" aria-hidden="true"><i id="vBar"></i></div>
      <div class="facts">
        <div><span>今日の反映</span><b id="vToday">¥0 / ¥3,000</b></div>
        <div><span>繰り越し</span><b id="vCarry">¥0</b></div>
        <div><span>連続</span><b id="vStreak">0日</b></div>
        <div><span>おやすみ券</span><b id="vTicket">0枚</b></div>
      </div>
      <div class="stats">
        <div class="stat"><small>攻撃力</small><b id="sAtk">10</b></div>
        <div class="stat"><small>HP</small><b id="sHp">100</b></div>
        <div class="stat"><small>守り</small><b id="sGuard">0%</b></div>
        <div class="stat"><small>技</small><b id="sSkill" class="sm">なし</b></div>
      </div>
      <button class="btn gold big" id="goTower">誘惑の塔へ</button>
    </div>

    <div class="sec">
      <h2>今日ガマンしたもの（押すと記録）</h2>
      <div class="presets" id="presets"></div>
      <form class="custom" id="customForm" autocomplete="off">
        <input id="cName" maxlength="20" placeholder="品名（なくてもOK）" aria-label="品名">
        <input id="cAmt" inputmode="numeric" placeholder="金額" aria-label="金額（円）">
        <button class="btn gold" type="submit">記録</button>
      </form>
      <p class="err" id="cErr"></p>
    </div>

    <div class="sec">
      <h2>履歴</h2>
      <div class="log" id="log"></div>
    </div>

    <div class="debug">
      <h2>試作用：日付を進める</h2>
      <p id="vDay"></p>
      <div class="custom">
        <button class="btn small" id="dNext">次の日へ（記録なし）</button>
        <button class="btn small" id="d7">7日進める（毎日¥500）</button>
        <button class="btn small" id="d30">30日進める（毎日¥500）</button>
        <button class="btn small" id="dReset">全部消す</button>
      </div>
      <p>この試作の記録は、このブラウザの中にだけ保存されます。</p>
    </div>
  </section>

  <section id="tower" class="sec" hidden>
    <h2>誘惑の塔</h2>
    <p id="tInfo" class="note num"></p>
    <div class="floors" id="floors"></div>
  </section>
</div>

<div class="layer" id="prep" hidden><div class="lbox" id="prepBox"></div></div>
<div class="layer" id="battle" hidden><div class="lbox" id="battleBox"></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== 計算（仕様書 4章）。記録の一覧と今日の日付だけから決まる ===== */
const CAP=3000, ROLL_H=4, MAX_LV=99;
const needFor=L=>30*L*L+70*L;
function lvOf(r){if(r<=0)return 0;return Math.min(MAX_LV,Math.floor((-70+Math.sqrt(4900+120*r))/60))}
const atkOf=L=>10*Math.pow(1.04,L);
const hpOf=L=>100*Math.pow(1.04,L);
const guardOf=streak=>Math.min(30,streak)*.005;
const SKILLS=[
  {id:'crit',lv:10,name:'会心の一撃',desc:'会心の確率 15%→30%'},
  {id:'shield',lv:25,name:'節約の盾',desc:'受けるダメージ −4%'},
  {id:'revenge',lv:45,name:'倍返し',desc:'HP半分以下で攻撃×1.15'},
  {id:'drain',lv:70,name:'満額回収',desc:'与えたダメージの10%回復'},
];
const isMonday=d=>((d%7)+7)%7===4; // 通し番号0 = 1970-01-01（木）
function realDay(){const t=new Date(Date.now()-ROLL_H*3600e3);return Math.round(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/864e5)}
function dayLabel(d){const t=new Date(d*864e5);const w='日月火水木金土'[t.getUTCDay()];return `${t.getUTCMonth()+1}月${t.getUTCDate()}日（${w}）`}

function derive(entries,today){
  const byDay=new Map(),cnt=new Map();let total=0;
  for(const e of entries){if(e.cx)continue;total+=e.amount;byDay.set(e.day,(byDay.get(e.day)||0)+e.amount);cnt.set(e.day,(cnt.get(e.day)||0)+1)}
  const out={total,refl:0,carry:0,todayRefl:0,streak:0,tickets:0};
  if(byDay.size){
    const start=Math.min(...byDay.keys());let carry=0,refl=0,streak=0,tickets=0;
    for(let d=start;d<=today;d++){
      if(d===start||isMonday(d))tickets=Math.min(2,tickets+1);
      const avail=carry+(byDay.get(d)||0),r=Math.min(CAP,avail);
      refl+=r;carry=avail-r;if(d===today)out.todayRefl=r;
      if(cnt.get(d))streak++;
      else if(d<today){if(streak>0&&tickets>0)tickets--;else streak=0}
    }
    Object.assign(out,{refl,carry,streak,tickets});
  }
  out.lv=lvOf(out.refl);out.atk=atkOf(out.lv);out.hp=hpOf(out.lv);out.guard=guardOf(out.streak);
  return out;
}
// 目標レベルまでの額と最短日数（1日の上限・繰り越し込み）
function needInfo(st,target){
  const need=Math.max(0,needFor(target)-st.refl);if(!need)return null;
  const room=CAP-st.todayRefl;
  return{need,more:Math.max(0,need-st.carry),days:need<=room?0:Math.ceil((need-room)/CAP)};
}

/* ===== 戦闘（仕様書 5.3）。勝ち負けは強さでほぼ決まる ===== */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const BOSS_HP_K=4.5, BOSS_ATK_K=4.2;
const recLv=f=>f-1;
const bossHp=f=>BOSS_HP_K*atkOf(recLv(f));
const bossAtk=f=>hpOf(recLv(f))/BOSS_ATK_K;
function fight(L,streak,skill,f,rng,log){
  const mx=hpOf(L),atk=atkOf(L),eAtk=bossAtk(f);
  let hp=mx,ehp=bossHp(f);
  const take=1-guardOf(streak),shield=skill==='shield'?.96:1,crit=skill==='crit'?.30:.15;
  for(let r=0;r<30;r++){
    const c=rng()<crit;let d=atk*(.75+.5*rng())*(c?1.5:1);
    if(skill==='revenge'&&hp<=mx/2)d*=1.15;
    ehp-=d;let heal=0;
    if(skill==='drain'){heal=Math.min(mx-hp,d*.10);hp+=heal}
    log&&log.push({who:'me',d,c,heal,hp,ehp:Math.max(0,ehp)});
    if(ehp<=0)return{win:true,hp,ehp:0,mx};
    const e=eAtk*(.75+.5*rng())*take*shield;hp-=e;
    log&&log.push({who:'foe',d:e,hp:Math.max(0,hp),ehp});
    if(hp<=0)return{win:false,hp:0,ehp,mx};
  }
  return{win:false,hp,ehp,mx};
}
function winRate(L,streak,skill,f,n=300){const rng=mulberry(hash(`odds|${f}|${L}|${streak}|${skill}`));let w=0;for(let i=0;i<n;i++)if(fight(L,streak,skill,f,rng).win)w++;return w/n}
const pctLabel=p=>p>=.995?'ほぼ確実':p<.005?'ほぼ0%':Math.round(p*10)*10+'%';

/* ===== 保存（試作なのでブラウザ内だけ） ===== */
const KEY='gaman-tower-proto-v2';
const PRESETS=[['コンビニコーヒー',150],['ペットボトル飲料',160],['コンビニおやつ',200],['カフェのドリンク',550],['ランチの外食',1000],['タクシー',1500],['飲み会の2次会',3000],['トレカ 1パック',180],['トレカ 1BOX',5500],['ネットのついで買い',2000]];
function blank(){return{entries:[],offset:0,cleared:0,losses:{},skill:null,seq:0}}
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>realDay()+S.offset;
const state=()=>derive(S.entries,today());
const unlocked=lv=>SKILLS.filter(s=>lv>=s.lv);
function equipped(st){const s=SKILLS.find(k=>k.id===S.skill);return s&&st.lv>=s.lv?s:null}
function lockedFloor(f,st){const l=S.losses[f];return !!(l&&l.day===today()&&l.lv>=st.lv)}

/* ===== ホーム ===== */
let toastT;
function toast(msg,big){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast'+(big?' big':'');t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),big?2800:1800)}
function record(name,amount){
  const before=state(),day=today();
  if(S.entries.filter(e=>e.day===day&&!e.cx).length>=30){toast('1日に記録できるのは30件までです');return}
  S.entries.push({id:++S.seq,day,name:name||'その他',amount,cx:false});save();
  const after=state();
  if(after.lv>before.lv){
    const sk=SKILLS.find(s=>s.lv>before.lv&&s.lv<=after.lv);
    if(sk&&!equipped(after)){S.skill=sk.id;save()}
    toast(`Lv${before.lv} → ${after.lv}！ 攻撃力 ${Math.round(before.atk)} → ${Math.round(after.atk)}${sk?`　新しい技：${sk.name}`:''}`,true);
  }else if(after.lv>=MAX_LV)toast(`${yen(amount)} 記録しました`);
  else toast(after.refl===before.refl?`${yen(amount)} は繰り越し（今日の反映は上限）`:`${yen(amount)} 記録。次のLvまで あと${yen(needFor(after.lv+1)-after.refl)}`);
  renderHome();
}
function renderPresets(){
  const box=$('presets');box.innerHTML='';
  for(const [n,a] of PRESETS){const b=document.createElement('button');b.className='pre';b.innerHTML=`<span>${esc(n)}</span><b>${yen(a)}</b>`;b.onclick=()=>record(n,a);box.appendChild(b)}
}
$('customForm').addEventListener('submit',e=>{
  e.preventDefault();
  const raw=$('cAmt').value.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,，¥￥円\s]/g,'');
  const a=Number(raw);
  if(!/^\d+$/.test(raw)||a<10||a>100000){$('cErr').textContent='金額は ¥10〜¥100,000 の整数で入れてください';return}
  $('cErr').textContent='';record($('cName').value.trim().slice(0,20),a);$('cName').value='';$('cAmt').value='';
});
let armed=null;
function renderLog(){
  const box=$('log');box.innerHTML='';
  if(!S.entries.length){box.innerHTML='<div class="empty">まだ記録がありません。上のボタンを押すと、その金額で記録されてすぐに強くなります。</div>';return}
  let lastDay=null;
  for(const e of [...S.entries].reverse().slice(0,40)){
    if(e.day!==lastDay){const h=document.createElement('div');h.className='logday';h.textContent=dayLabel(e.day)+(e.day===today()?'　今日':'');box.appendChild(h);lastDay=e.day}
    const r=document.createElement('div');r.className='item'+(e.cx?' cx':'');
    r.innerHTML=`<span class="nm">${esc(e.name)}</span><span class="am">${yen(e.amount)}</span>`;
    if(e.cx){r.insertAdjacentHTML('beforeend','<span class="undo">取り消し済み</span>')}
    else{const b=document.createElement('button');b.className='undo'+(armed===e.id?' arm':'');b.textContent=armed===e.id?'本当に取り消す':'やっぱり買った';
      b.onclick=()=>{if(armed!==e.id){armed=e.id;renderLog();return}armed=null;const before=state();e.cx=true;save();const after=state();renderHome();toast(after.lv<before.lv?`取り消しました（Lv${before.lv} → ${after.lv}）`:'取り消しました')};
      r.appendChild(b)}
    box.appendChild(r);
  }
}
function renderHome(){
  const st=state();
  $('vTotal').textContent=yen(st.total);$('vLv').textContent=st.lv;
  if(st.lv>=MAX_LV){$('vNext').textContent='最大レベル';$('vBar').style.width='100%'}
  else{const a=needFor(st.lv),b=needFor(st.lv+1);$('vNext').textContent=`次のLvまで あと${yen(b-st.refl)}`;$('vBar').style.width=((st.refl-a)/(b-a)*100).toFixed(1)+'%'}
  $('vToday').textContent=`${yen(st.todayRefl)} / ${yen(CAP)}`;
  $('vCarry').textContent=st.carry?`${yen(st.carry)}（明日以降）`:'¥0';
  $('vStreak').textContent=st.streak+'日';$('vTicket').textContent=st.tickets+'枚';
  $('sAtk').textContent=Math.round(st.atk);$('sHp').textContent=Math.round(st.hp);
  $('sGuard').textContent=`−${+(st.guard*100).toFixed(1)}%`;
  const sk=equipped(st);$('sSkill').textContent=sk?sk.name:(st.lv<10?'Lv10で解放':'なし');
  $('goTower').textContent=S.cleared>=100?'誘惑の塔（制覇済み）':`誘惑の塔へ（${Math.min(100,S.cleared+1)}階に挑戦）`;
  $('vDay').textContent=`いまの日付：${dayLabel(today())}${S.offset?`（本当の今日から ${S.offset}日後）`:''}`;
  renderLog();
}
$('dNext').onclick=()=>{S.offset++;save();renderHome();toast(dayLabel(today())+' になりました')};
function sim(n){for(let i=0;i<n;i++){S.offset++;S.entries.push({id:++S.seq,day:today(),name:'まとめて記録（試作）',amount:500,cx:false})}save();const st=state();if(!equipped(st)&&unlocked(st.lv).length){S.skill=unlocked(st.lv).at(-1).id;save()}renderHome();toast(`${n}日進めました　Lv${st.lv}`,true)}
$('d7').onclick=()=>sim(7);$('d30').onclick=()=>sim(30);
let resetArm=false;
$('dReset').onclick=()=>{if(!resetArm){resetArm=true;$('dReset').textContent='本当に全部消す';$('dReset').classList.add('red');return}S=blank();save();resetArm=false;$('dReset').textContent='全部消す';$('dReset').classList.remove('red');renderHome();toast('全部消しました')};

/* ===== 塔（仕様書 5章） ===== */
const BOSSES=['コンビニの誘惑','自販機の誘惑','カフェの誘惑','サブスクの誘惑','タイムセールの誘惑','送料無料まであと少しの誘惑','限定品の誘惑','新作パックの誘惑','推しグッズの誘惑','衝動買いの化身'];
const bossName=f=>f===100?'衝動買いの化身・真':`${BOSSES[Math.floor((f-1)/10)]} ${(f-1)%10+1}`;
function renderTower(){
  const st=state(),box=$('floors'),sk=equipped(st);box.innerHTML='';
  $('tInfo').textContent=`${S.cleared} / 100階 クリア　あなたは Lv${st.lv}・連続${st.streak}日${sk?'・'+sk.name:''}`;
  const top=Math.min(100,S.cleared+1);
  if(S.cleared<99){const l=document.createElement('button');l.className='floor';l.disabled=true;l.innerHTML=`<span class="fl">${top+1}F</span><span class="bn">？？？<small>${top}階をクリアすると開きます</small></span><span></span>`;box.appendChild(l)}
  for(let f=top;f>=Math.max(1,top-30);f--){
    const b=document.createElement('button');b.className='floor';
    const done=f<=S.cleared,lock=!done&&lockedFloor(f,st);
    let chip;
    if(done)chip=['done','クリア'];
    else if(lock)chip=['lock','明日また挑戦'];
    else{const p=winRate(st.lv,st.streak,sk&&sk.id,f,200);chip=[p>=.7?'ok':p>=.35?'mid':'hard','勝率 '+pctLabel(p)]}
    b.innerHTML=`<span class="fl">${f}F</span><span class="bn">${esc(bossName(f))}<small>推奨Lv${recLv(f)}・HP ${Math.round(bossHp(f)).toLocaleString()}・攻撃 ${Math.round(bossAtk(f))}</small></span><span class="chip ${chip[0]}">${chip[1]}</span>`;
    b.onclick=()=>openPrep(f);box.appendChild(b);
  }
}
function tab(which){$('home').hidden=which!=='home';$('tower').hidden=which!=='tower';$('tabHome').setAttribute('aria-current',which==='home');$('tabTower').setAttribute('aria-current',which==='tower');if(which==='tower')renderTower();else renderHome();window.scrollTo(0,0)}
$('tabHome').onclick=()=>tab('home');$('tabTower').onclick=()=>tab('tower');$('goTower').onclick=()=>tab('tower');

/* ===== 絵（勇者と値札のボス） ===== */
const HERO_SVG=`<svg class="sprite" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="5" y="1" width="6" height="2" fill="#f2c14e"/><rect x="4" y="3" width="8" height="5" fill="#f5d6b4"/><rect x="5" y="5" width="2" height="1" fill="#08100d"/><rect x="9" y="5" width="2" height="1" fill="#08100d"/><rect x="4" y="8" width="8" height="5" fill="#6fd3ff"/><rect x="7" y="9" width="2" height="2" fill="#f2c14e"/><rect x="2" y="7" width="2" height="6" fill="#93aa9c"/><rect x="12" y="4" width="1" height="8" fill="#edf4ec"/><rect x="5" y="13" width="2" height="2" fill="#26392f"/><rect x="9" y="13" width="2" height="2" fill="#26392f"/></svg>`;
const BOSS_SVG=`<svg class="sprite" viewBox="0 0 84 84" aria-hidden="true"><path d="M8 26h46l22 16-22 16H8z" fill="#ff5d5d"/><circle cx="56" cy="42" r="5" fill="#08100d"/><text x="30" y="51" text-anchor="middle" font-size="26" font-weight="700" fill="#2a0707" font-family="sans-serif">¥</text><path d="M61 42c8 0 12-10 18-14" stroke="#93aa9c" stroke-width="2" fill="none"/></svg>`;

/* ===== 戦う前（仕様書 5.5） ===== */
let prepF=0;
function openPrep(f){prepF=f;renderPrep();$('prep').hidden=false;$('prep').scrollTop=0}
function renderPrep(){
  const f=prepF,st=state(),sk=equipped(st),done=f<=S.cleared,lock=!done&&lockedFloor(f,st);
  const p=winRate(st.lv,st.streak,sk&&sk.id,f);
  let hint='';
  if(p<.7&&st.lv<MAX_LV){
    const last=MAX_LV;
    for(let t=Math.max(st.lv+1,recLv(f)-4);t<=last;t++){const q=winRate(t,st.streak,sk&&sk.id,f,200);if(q>=.7||t===last){const n=needInfo(st,t);hint=`<div class="hint">Lv${t}（あと <b>${yen(n.more)}</b> のガマン${n.days?`・最短${n.days}日後`:''}）なら 勝率 <b>${pctLabel(q)}</b></div>`;break}}
  }
  const skills=SKILLS.map(s=>`<button class="skill" data-id="${s.id}" aria-pressed="${!!(sk&&sk.id===s.id)}" ${st.lv<s.lv?'disabled':''}><b>${s.name}</b><span>${st.lv<s.lv?`Lv${s.lv}で解放`:s.desc}</span></button>`).join('');
  $('prepBox').innerHTML=`
    <div class="lhead"><span class="fl">${f}F・推奨Lv${recLv(f)}</span><button class="btn small" id="pClose">もどる</button></div>
    <div class="vs">
      <div class="fighter">${HERO_SVG}<span class="nm">勇者 Lv${st.lv}</span><dl><dt>HP</dt><dd>${Math.round(st.hp)}</dd><dt>攻撃</dt><dd>${Math.round(st.atk)}</dd><dt>守り</dt><dd>−${+(st.guard*100).toFixed(1)}%</dd></dl></div>
      <div class="fighter">${BOSS_SVG}<span class="nm">${esc(bossName(f))}</span><dl><dt>HP</dt><dd>${Math.round(bossHp(f)).toLocaleString()}</dd><dt>攻撃</dt><dd>${Math.round(bossAtk(f))}</dd></dl></div>
    </div>
    <div class="sec"><h2>技（1つ装備）</h2><div class="skills">${skills}</div></div>
    <div class="odds"><span class="note">勝率の目安</span><span class="pct" style="color:var(${p>=.7?'--ok':p>=.35?'--warn':'--red'})">${pctLabel(p)}</span>${hint}</div>
    ${lock?`<p class="note" style="text-align:center">この階には今日すでに負けています。日付が変わるか、レベルが上がると再挑戦できます。</p>`:''}
    <button class="btn gold big" id="pFight" ${lock?'disabled':''}>${done?'もう一度戦う（記録に残りません）':'戦う'}</button>`;
  $('pClose').onclick=()=>{$('prep').hidden=true;renderTower()};
  $('pFight').onclick=()=>startBattle(f);
  $('prepBox').querySelectorAll('.skill').forEach(b=>b.onclick=()=>{S.skill=S.skill===b.dataset.id?null:b.dataset.id;save();renderPrep()});
}

/* ===== 戦闘（仕様書 5.6） ===== */
let B=null;
function startBattle(f){
  const st=state(),sk=equipped(st),log=[];
  const res=fight(st.lv,st.streak,sk&&sk.id,f,mulberry(hash(`battle|${f}|${today()}|${st.lv}`)),log);
  B={f,st,sk,res,log,i:0,speed:1,timer:0,done:f<=S.cleared};
  $('prep').hidden=true;$('battle').hidden=false;$('battle').scrollTop=0;
  $('battleBox').innerHTML=`
    <div class="lhead"><span class="fl">${f}F　${esc(bossName(f))}</span><span class="hpn">x<span id="bSpd">1</span></span></div>
    <div class="vs">
      <div class="fighter" id="fMe">${HERO_SVG}<span class="nm">勇者 Lv${st.lv}</span><div class="hp me"><i id="hMe"></i></div><span class="hpn" id="nMe"></span></div>
      <div class="fighter" id="fFoe">${BOSS_SVG}<span class="nm">${esc(bossName(f))}</span><div class="hp foe"><i id="hFoe"></i></div><span class="hpn" id="nFoe"></span></div>
    </div>
    <div class="blog" id="bLog" aria-live="polite"><span>${esc(bossName(f))} が現れた！</span></div>
    <div class="ctrl" id="bCtrl"><button class="btn" id="bFast">2倍速</button><button class="btn" id="bSkip">結果まで飛ばす</button></div>`;
  setBars(res.mx,res.mx,bossHp(f));
  $('bFast').onclick=()=>{B.speed=B.speed===1?2:1;$('bSpd').textContent=B.speed;$('bFast').textContent=B.speed===1?'2倍速':'ふつうの速さ'};
  $('bSkip').onclick=()=>{clearTimeout(B.timer);while(B.i<B.log.length)playEvent(B.log[B.i++],true);endBattle()};
  B.timer=setTimeout(tick,700);
}
function setBars(hp,mx,ehp){
  $('hMe').style.width=Math.max(0,hp/mx*100)+'%';$('nMe').textContent=`${Math.max(0,Math.round(hp))} / ${Math.round(mx)}`;
  const em=bossHp(B?B.f:prepF);$('hFoe').style.width=Math.max(0,ehp/em*100)+'%';$('nFoe').textContent=`${Math.max(0,Math.round(ehp)).toLocaleString()} / ${Math.round(em).toLocaleString()}`;
}
function popAt(el,text,cls){const p=document.createElement('span');p.className='pop '+cls;p.textContent=text;el.appendChild(p);setTimeout(()=>p.remove(),700);el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}
function playEvent(ev,quiet){
  const line=document.createElement('span');
  if(ev.who==='me'){
    line.className=ev.c?'crit':'';line.textContent=`${ev.c?'会心の一撃！ ':''}勇者の攻撃！ ${Math.round(ev.d)}ダメージ${ev.heal>=1?`（${Math.round(ev.heal)}回復）`:''}`;
    if(!quiet)popAt($('fFoe'),Math.round(ev.d),ev.c?'crit':'');
  }else{line.className='foe';line.textContent=`${bossName(B.f).replace(/ \d+$/,'')}の攻撃！ ${Math.round(ev.d)}ダメージ`;if(!quiet)popAt($('fMe'),Math.round(ev.d),'')}
  $('bLog').appendChild(line);$('bLog').scrollTop=1e9;
  setBars(ev.hp,B.res.mx,ev.ehp);
}
function tick(){if(!B)return;if(B.i>=B.log.length)return endBattle();playEvent(B.log[B.i++]);B.timer=setTimeout(tick,400/B.speed)}
function endBattle(){
  const {f,st,res}=B;
  let html;
  if(res.win){
    const first=f>S.cleared;if(first){S.cleared=f;delete S.losses[f]}save();
    html=`<div class="res"><h3 style="color:var(--gold)">${f}F クリア！</h3><p>${f===100?'衝動買いの化身を倒しました。塔の頂上です':`残りHP ${Math.round(res.hp)} / ${Math.round(res.mx)}`}</p><div class="ctrl">${f<100&&first?'<button class="btn gold" id="rNext">次の階へ</button>':''}<button class="btn" id="rBack">塔に戻る</button></div></div>`;
  }else{
    if(!B.done){S.losses[f]={day:today(),lv:st.lv};save()}
    const pct=Math.ceil(res.ehp/bossHp(f)*100),rec=recLv(f),target=Math.max(rec,st.lv+1);
    let need;
    if(st.lv>=MAX_LV)need='<p>最大レベルです。明日もう一度挑戦できます</p>';
    else{const n=needInfo(st,target);need=`<div class="need">${st.lv<rec?`推奨 Lv${rec}`:`Lv${target}`} まで<b>あと ${yen(n.more)} のガマン</b><span class="note">${n.days?`最短 ${n.days}日後に届きます（1日の反映は${yen(CAP)}まで）`:'今日中に届きます'}。届けばすぐ再挑戦できます。${st.lv>=rec?'<br>または、明日もう一度挑戦できます。':''}</span></div>`}
    html=`<div class="res"><h3 style="color:var(--red)">負けた…</h3><p>ボスの残りHP ${pct}%</p>${need}<div class="ctrl"><button class="btn gold" id="rRec">ガマンを記録</button><button class="btn" id="rBack">塔に戻る</button></div></div>`;
  }
  $('bCtrl').outerHTML=html;
  $('rNext')&&($('rNext').onclick=()=>{closeBattle();openPrep(f+1)});
  $('rRec')&&($('rRec').onclick=()=>{closeBattle();tab('home')});
  $('rBack').onclick=()=>{closeBattle();tab('tower')};
}
function closeBattle(){if(B)clearTimeout(B.timer);B=null;$('battle').hidden=true}

/* ===== 起動 ===== */
renderPresets();
// 初めて開いたときは、何ができるか分かるように例の記録を入れておく
try{if(!S.entries.length&&!S.offset&&!localStorage.getItem(KEY+'-seeded')){const d=today();S.entries.push({id:++S.seq,day:d-2,name:'コンビニコーヒー（例）',amount:150,cx:false},{id:++S.seq,day:d-1,name:'ランチの外食（例）',amount:1000,cx:false},{id:++S.seq,day:d,name:'トレカ 1BOX（例）',amount:5500,cx:false});save();localStorage.setItem(KEY+'-seeded','1')}}catch(e){}
renderHome();
</script>
