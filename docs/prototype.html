<title>弾幕メーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: phone-first single column. Three screens (コースワールド / エディタ / プレイ) swap in place; play is a full-screen arcade cabinet. */
:root{
  --ink:#110e26; --ink2:#0a0818; --panel:#1c1740; --line:#332b62; --fg:#efeaff; --dim:#a39bd0;
  --pink:#ff6b9d; --cyan:#5ce1e6; --gold:#ffd166; --ok:#7cf29c;
  --display:"DotGothic16","Zen Kaku Gothic New",monospace;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:0;letter-spacing:.04em}
h1 span{color:var(--pink)}
.sub{color:var(--dim);font-size:13px;margin:4px 0 0}
h2{font-family:var(--display);font-weight:400;font-size:17px;margin:0;letter-spacing:.06em;color:var(--cyan)}
.sec{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#1a0b14}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#06222a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:6px 10px;font-size:13px}
.stage{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stage .nm{font-weight:700;font-size:16px;min-width:0;overflow-wrap:anywhere}
.stage .by{color:var(--dim);font-size:12px}
.stage .meta{grid-column:1/-1;display:flex;gap:12px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stage .meta b{color:var(--fg);font-weight:700}
.rate{font-family:var(--display);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums;text-align:right}
.rate small{display:block;font-family:var(--body);font-size:10px;color:var(--dim);letter-spacing:.08em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts{grid-column:1/-1;display:flex;gap:8px;margin-top:4px}
.empty{color:var(--dim);font-size:13px;border:1px dashed var(--line);border-radius:12px;padding:14px}
.codebox{display:flex;gap:8px}
.codebox input{flex:1;min-width:0;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.note{font-size:12px;color:var(--dim)}
.err{color:var(--pink);font-size:13px}
/* editor */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--dim);letter-spacing:.04em}
.field input[type=text],.field select{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.em{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.em-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.em-head .tag{font-family:var(--display);color:var(--gold)}
.pv{width:100%;aspect-ratio:360/330;max-width:100%;border-radius:10px;background:var(--ink2);box-shadow:none}
.sl{display:grid;grid-template-columns:5.5em 1fr 3.4em;gap:8px;align-items:center;font-size:13px}
.sl span:first-child{color:var(--dim)}
.sl output{text-align:right;font-variant-numeric:tabular-nums}
.sl input{width:100%;accent-color:var(--pink)}
.sw{display:flex;gap:8px}
.sw input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;margin:0}
.sw input:checked{border-color:var(--fg);box-shadow:0 0 0 2px var(--ink)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes label{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer}
.modes label b{font-family:var(--display);font-weight:400;font-size:17px}
.modes label span{font-size:12px;color:var(--dim)}
.modes input{position:absolute;opacity:0;pointer-events:none}
.modes input:checked+label{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.modes input:focus-visible+label{outline:2px solid var(--gold);outline-offset:2px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid currentColor;margin-right:6px;vertical-align:2px}
.badge.boss{color:var(--pink)}.badge.surv{color:var(--cyan)}
.status{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--ink2);border:1px solid var(--line)}
.status.ok{border-color:var(--ok);color:var(--ok)}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar .btn{flex:1 1 140px}
/* play */
#play{position:fixed;inset:0;background:var(--ink2);display:flex;flex-direction:column;z-index:20;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.pbar{display:flex;align-items:center;gap:10px;padding:10px 16px}
.pbar .ttl{flex:1;min-width:0;font-family:var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .tm{font-family:var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
#stagebox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;touch-action:none;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.hint{text-align:center;font-size:12px;color:var(--dim);padding:6px 16px 12px}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,24,.72)}
.rbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;align-items:center;width:min(300px,86%);text-align:center}
.rbox .big{font-family:var(--display);font-size:34px;line-height:1.1}
.rbox .big.win{color:var(--gold)}
.rbox .big.lose{color:var(--pink)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,8,24,.8);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px}
.xbtn{background:var(--fg);border-color:var(--fg);color:var(--ink);text-decoration:none;display:inline-block}
.mbox textarea{width:100%;box-sizing:border-box;height:110px;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;word-break:break-all;resize:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div id="home" class="wrap">
  <header class="top">
    <div>
      <h1>弾幕<span>メーカー</span></h1>
      <p class="sub">作って、クリアして、コードで送りつけろ。</p>
    </div>
    <button class="btn primary" id="new-btn">＋ ステージを作る</button>
  </header>

  <section class="sec">
    <h2>コードで遊ぶ</h2>
    <div class="codebox">
      <input id="code-in" type="text" placeholder="DM1- から始まるコードを貼り付け" autocomplete="off">
      <button class="btn cyan" id="code-play">遊ぶ</button>
    </div>
    <div class="err" id="code-err" hidden></div>
  </section>

  <section class="sec">
    <h2>世界のステージ</h2>
    <div id="list-sample" class="sec"></div>
  </section>

  <section class="sec">
    <h2>受け取ったステージ</h2>
    <div id="list-recv" class="sec"></div>
  </section>

  <section class="sec">
    <h2>自分の投稿</h2>
    <div id="list-mine" class="sec"></div>
  </section>

  <p class="note">試作版です。記録とステージはこの端末のブラウザにだけ保存され、他の人へは共有コードで渡します。</p>
</div>

<div id="edit" class="wrap" hidden>
  <header class="top">
    <h1>エディタ</h1>
    <button class="btn small" id="ed-back">← 一覧へ</button>
  </header>
  <div class="field"><label>クリア条件</label>
    <div class="modes">
      <input type="radio" name="ed-mode" id="ed-mode-s" value="survive"><label for="ed-mode-s"><b>耐えきる</b><span>決めた時間、被弾せずに生き残る</span></label>
      <input type="radio" name="ed-mode" id="ed-mode-b" value="boss"><label for="ed-mode-b"><b>ボスを倒す</b><span>自動ショットでHPを削りきる</span></label>
    </div>
  </div>
  <div class="grid2">
    <div class="field"><label for="ed-name">ステージ名</label><input id="ed-name" type="text" maxlength="20" placeholder="例：地獄の渦"></div>
    <div class="field"><label for="ed-author">作者名</label><input id="ed-author" type="text" maxlength="12" placeholder="例：Koshin"></div>
  </div>
  <div class="grid2">
    <div class="field"><label for="ed-dur" id="ed-dur-l">耐える時間</label><select id="ed-dur"></select></div>
    <div class="field" id="ed-mv-f"><label for="ed-mv">ボスの動き</label><select id="ed-mv"><option value="0">動かない</option><option value="1">ゆっくり左右</option><option value="2">速く左右</option></select></div>
  </div>
  <div class="sl" id="ed-hp-f"><span>ボスHP</span><input type="range" id="ed-hp" min="100" max="1000" step="50"><output id="ed-hp-o"></output></div>
  <p class="note" id="ed-boss-note" style="margin:0">ボス戦では発射台はボスにくっつきます。HPが減るごとに「第1〜第3段階」に切り替わり、切り替わりで画面の弾が消えます。</p>
  <div id="ed-ems" class="sec"></div>
  <button class="btn" id="ed-add">＋ 発射台を追加</button>
  <div class="status" id="ed-status"></div>
  <div class="bar">
    <button class="btn cyan" id="ed-test">テストプレイ</button>
    <button class="btn primary" id="ed-post" disabled>投稿してコード発行</button>
  </div>
</div>

<div id="play" hidden>
  <div class="pbar">
    <button class="btn small" id="p-quit">やめる</button>
    <div class="ttl" id="p-title"></div>
    <div class="tm" id="p-time">0.0</div>
  </div>
  <div id="stagebox">
    <canvas id="cv"></canvas>
    <div id="result" hidden>
      <div class="rbox">
        <div class="big" id="r-big"></div>
        <div id="r-msg" class="note"></div>
        <div class="row" style="justify-content:center">
          <button class="btn primary" id="r-retry">もう一度</button>
          <button class="btn" id="r-back">戻る</button>
        </div>
      </div>
    </div>
  </div>
  <div class="hint">画面のどこでもドラッグで移動 ／ キーボード：矢印キー、Shiftで低速</div>
</div>

<div id="modal" hidden>
  <div class="mbox">
    <h2>共有コード</h2>
    <p class="note" style="margin:0">このコードを友達に送ると、同じステージを遊べます。</p>
    <textarea id="m-code" readonly></textarea>
    <p class="note" id="m-warn" style="margin:0" hidden></p>
    <div class="row">
      <a class="btn xbtn" id="m-x" href="#" target="_blank" rel="noopener">Xでシェア</a>
      <button class="btn cyan" id="m-copy">コピー</button>
      <button class="btn" id="m-close">閉じる</button>
      <span class="note" id="m-msg"></span>
    </div>
  </div>
</div>

<script>
const W=360,H=540;
const PAL=['#ff6b9d','#5ce1e6','#ffd166','#b28dff','#7cf29c'];
const TK=['ring','spiral','aim','rain','sweep'];
const TYPES={ring:'放射',spiral:'渦巻き',aim:'自機狙い',rain:'雨',sweep:'首ふり扇'};
const DEF={ring:{i:1,c:16,v:2,r:6},spiral:{i:.1,c:3,v:2,r:11},aim:{i:.8,c:5,v:3,r:40},rain:{i:.25,c:2,v:2,r:0},sweep:{i:.15,c:5,v:2.5,r:60}};
const RLABEL={ring:'回転',spiral:'回転',aim:'広がり',rain:'（なし）',sweep:'振れ幅'};
const $=id=>document.getElementById(id);

const SAMPLES=[
 {id:'s1',n:'はじめての渦',a:'サンプル',d:20,e:[{t:'spiral',x:.5,y:.25,s:0,e:20,i:.12,c:3,v:1.8,r:11,k:1}]},
 {id:'s2',n:'にわか雨',a:'サンプル',d:20,e:[{t:'rain',x:.5,y:0,s:0,e:20,i:.18,c:2,v:2.2,r:0,k:1},{t:'aim',x:.5,y:.15,s:5,e:20,i:1.5,c:3,v:2.5,r:30,k:2}]},
 {id:'s3',n:'見てるぞ',a:'サンプル',d:20,e:[{t:'aim',x:.2,y:.15,s:0,e:20,i:.9,c:5,v:3,r:40,k:0},{t:'aim',x:.8,y:.15,s:.45,e:20,i:.9,c:5,v:3,r:40,k:3}]},
 {id:'s5',n:'三段変化のボス',a:'サンプル',m:'boss',h:400,mv:1,d:60,e:[{t:'aim',x:.5,y:.2,s:0,e:30,i:.6,c:5,v:2.6,r:50,k:2,ph:1},{t:'ring',x:.5,y:.2,s:0,e:30,i:.55,c:18,v:2,r:9,k:0,ph:2},{t:'spiral',x:.5,y:.2,s:0,e:30,i:.09,c:4,v:2.1,r:13,k:3,ph:3},{t:'aim',x:.5,y:.2,s:0,e:30,i:1.4,c:3,v:3.2,r:20,k:1,ph:3}]},
 {id:'s4',n:'鬼畜・花火大会',a:'サンプル',d:20,e:[{t:'ring',x:.3,y:.2,s:0,e:20,i:.7,c:20,v:2.2,r:7,k:0},{t:'ring',x:.7,y:.2,s:.35,e:20,i:.7,c:20,v:2.2,r:-7,k:2},{t:'sweep',x:.5,y:.1,s:6,e:20,i:.2,c:3,v:3,r:70,k:1}]}
];

const store={get(k,d){try{const v=localStorage.getItem('dm_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('dm_'+k,JSON.stringify(v))}catch(e){}}};
let mine=store.get('mine',[]),recv=store.get('recv',[]),stats=store.get('stats',{});

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const r2=n=>Math.round(n*100)/100;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,Number(v)||0));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function mkEm(t){const d=DEF[t];return{t,x:.5,y:.2,s:0,e:draft?draft.d:30,i:d.i,c:d.c,v:d.v,r:d.r,k:0,ph:0}}
const DURS={survive:[10,20,30,45,60,90,120],boss:[30,60,90,120,180]};
const PHASES=['全段階','第1段階','第2段階','第3段階'];
function sanitize(st){
  const m=st.m==='boss'?'boss':'survive';
  const d=DURS[m].includes(+st.d)?+st.d:DURS[m][1];
  return{m,h:Math.round(clamp(st.h||400,100,1000)),mv:Math.round(clamp(st.mv,0,2)),n:String(st.n||'名無しステージ').slice(0,20),a:String(st.a||'名無し').slice(0,12),d,
    e:(st.e||[]).slice(0,8).filter(m=>TYPES[m.t]).map(m=>({t:m.t,x:clamp(m.x,0,1),y:clamp(m.y,0,.6),s:clamp(m.s,0,180),e:clamp(m.e,0,180),i:clamp(m.i,.05,2),c:Math.round(clamp(m.c,1,36)),v:clamp(m.v,1,5),r:clamp(m.r,-90,90),k:Math.round(clamp(m.k,0,4)),ph:Math.round(clamp(m.ph,0,3))}))};
}
function enc(st){
  const o={m:st.m==='boss'?1:0,h:st.h,mv:st.mv,n:st.n,a:st.a,d:st.d,e:st.e.map(m=>[TK.indexOf(m.t),r2(m.x),r2(m.y),r2(m.s),r2(m.e),r2(m.i),m.c,r2(m.v),Math.round(m.r),m.k,m.ph||0])};
  return 'DM1-'+btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function dec(code){
  code=code.trim();if(!code.startsWith('DM1-'))throw new Error('fmt');
  let b=code.slice(4).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
  const o=JSON.parse(decodeURIComponent(escape(atob(b))));
  const st=sanitize({m:o.m?'boss':'survive',h:o.h,mv:o.mv,n:o.n,a:o.a,d:o.d,e:(o.e||[]).map(a=>({t:TK[a[0]],x:a[1],y:a[2],s:a[3],e:a[4],i:a[5],c:a[6],v:a[7],r:a[8],k:a[9],ph:a[10]||0}))});
  if(!st.e.length)throw new Error('empty');
  st.id='c'+hash(enc(st));return st;
}

/* ---------- screens ---------- */
function show(id){for(const s of ['home','edit'])$(s).hidden=s!==id;$('play').hidden=id!=='play';if(id!=='play')window.scrollTo(0,0)}

function card(st,kind){
  const s=stats[st.id]||{t:0,c:0},rate=s.t?Math.round(s.c/s.t*100)+'%':'—';
  const acts=kind==='mine'?`<div class="acts"><button class="btn small" data-act="edit" data-id="${st.id}">編集</button><button class="btn small" data-act="code" data-id="${st.id}">コード</button></div>`:
    kind==='recv'?`<div class="acts"><button class="btn small" data-act="code" data-id="${st.id}">コード</button></div>`:'';
  return `<div class="stage" role="button" tabindex="0" data-act="play" data-id="${st.id}">
    <div><div class="nm">${esc(st.n)}</div><div class="by">${st.m==='boss'?`<span class="badge boss">ボス</span>HP${st.h}・制限${st.d}秒`:`<span class="badge surv">耐久</span>${st.d}秒耐える`}・by ${esc(st.a)}</div></div>
    <div class="rate">${rate}<small>クリア率</small></div>
    <div class="meta"><span>挑戦 <b>${s.t}</b></span><span>クリア <b>${s.c}</b></span></div>${acts}</div>`;
}
function renderHome(){
  $('list-sample').innerHTML=SAMPLES.map(s=>card(s,'sample')).join('');
  $('list-recv').innerHTML=recv.length?recv.map(s=>card(s,'recv')).join(''):'<div class="empty">友達からもらったコードで遊ぶと、ここに並びます。</div>';
  $('list-mine').innerHTML=mine.length?mine.map(s=>card(s,'mine')).join(''):'<div class="empty">まだ投稿がありません。右上の「ステージを作る」から始めましょう。投稿するには自分でクリアする必要があります。</div>';
}
const findStage=id=>SAMPLES.find(s=>s.id===id)||mine.find(s=>s.id===id)||recv.find(s=>s.id===id);
$('home').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const st=findStage(el.dataset.id);if(!st)return;e.stopPropagation();
  if(el.dataset.act==='play')startGame(st,'play');
  else if(el.dataset.act==='edit')openEditor(st);
  else if(el.dataset.act==='code')openModal(enc(st),st);
});
$('home').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('stage')){e.preventDefault();e.target.click()}});
$('code-play').onclick=()=>{
  const err=$('code-err');err.hidden=true;
  try{const st=dec($('code-in').value);if(!recv.find(s=>s.id===st.id)&&!mine.find(s=>s.id===st.id)){recv.unshift(st);store.set('recv',recv)}$('code-in').value='';renderHome();startGame(st,'play')}
  catch(x){err.textContent='コードを読み取れませんでした。DM1- から最後まで全部貼り付けてください。';err.hidden=false}
};
$('new-btn').onclick=()=>openEditor(null);

/* ---------- editor ---------- */
let draft=null;
function openEditor(st){
  draft=st?JSON.parse(JSON.stringify(st)):{id:null,m:'survive',h:400,mv:1,n:'',a:store.get('author',''),d:20,e:[mkEm('spiral')]};
  draft.m=draft.m||'survive';draft.h=draft.h||400;draft.mv=draft.mv??1;draft.verified=false;
  $('ed-name').value=draft.n;$('ed-author').value=draft.a;$('ed-mv').value=draft.mv;$('ed-hp').value=draft.h;
  renderMode();updStatus();show('edit');
}
function renderMode(){
  const b=draft.m==='boss';
  $('ed-mode-s').checked=!b;$('ed-mode-b').checked=b;
  if(!DURS[draft.m].includes(draft.d))draft.d=DURS[draft.m][1];
  $('ed-dur').innerHTML=DURS[draft.m].map(v=>`<option value="${v}"${v===draft.d?' selected':''}>${v}秒</option>`).join('');
  $('ed-dur-l').textContent=b?'制限時間':'耐える時間';
  $('ed-mv-f').hidden=!b;$('ed-hp-f').hidden=!b;$('ed-boss-note').hidden=!b;
  $('ed-hp-o').textContent=draft.h;
  renderEms();
}
const SLIDERS=[['x','横位置',0,1,.05,v=>Math.round(v*100)+'%'],['y','縦位置',0,.6,.05,v=>Math.round(v*100)+'%'],['s','開始',0,180,.5,v=>v+'秒'],['e','終了',0,180,.5,v=>+v>=draft.d?'最後まで':v+'秒'],['i','発射間隔',.05,2,.05,v=>(+v).toFixed(2)+'s'],['c','弾数',1,36,1,v=>v],['v','弾の速さ',1,5,.25,v=>(+v).toFixed(2)],['r','角度',-90,90,1,v=>v+'°']];
function renderEms(){
  $('ed-ems').innerHTML=draft.e.map((m,i)=>`<div class="em" data-i="${i}">
    <div class="em-head"><span class="tag">発射台 ${i+1}</span>${draft.e.length>1?`<button class="btn small" data-del="${i}">削除</button>`:''}</div>
    <canvas class="pv" aria-label="${TYPES[m.t]}のプレビュー"></canvas>
    <div class="grid2">
      <div class="field"><label for="em${i}-t">パターン</label><select id="em${i}-t" data-k="t">${TK.map(t=>`<option value="${t}"${t===m.t?' selected':''}>${TYPES[t]}</option>`).join('')}</select></div>
      <div class="field"><label>弾の色</label><div class="sw">${PAL.map((c,j)=>`<input type="radio" name="em${i}-k" id="em${i}-k${j}" data-k="k" value="${j}" aria-label="色${j+1}" style="background:${c}"${j===m.k?' checked':''}>`).join('')}</div></div>
    </div>
    ${draft.m==='boss'?`<div class="field"><label for="em${i}-ph">使う段階</label><select id="em${i}-ph" data-k="ph">${PHASES.map((p,j)=>`<option value="${j}"${j===m.ph?' selected':''}>${p}</option>`).join('')}</select></div>`:''}
    ${SLIDERS.filter(s=>draft.m!=='boss'||!['x','y','s','e'].includes(s[0])).map(([k,l,mn,mx,st,f])=>`<div class="sl"><span>${k==='r'?RLABEL[m.t]:l}</span><input type="range" id="em${i}-${k}" data-k="${k}" min="${mn}" max="${k==='s'||k==='e'?draft.d:mx}" step="${st}" value="${k==='e'?Math.min(m[k],draft.d):m[k]}"${(m.t==='rain'&&(k==='x'||k==='y'||k==='r'))?' disabled':''}><output>${f(m[k])}</output></div>`).join('')}
  </div>`).join('');
  $('ed-add').disabled=draft.e.length>=8;
  setupPreviews();
}
$('ed-ems').addEventListener('input',e=>{
  const el=e.target,card=el.closest('.em');if(!card||!el.dataset.k)return;
  const m=draft.e[+card.dataset.i],k=el.dataset.k;
  if(k==='t'){Object.assign(m,{t:el.value},DEF[el.value]);renderEms()}
  else{m[k]=+el.value;const o=el.nextElementSibling;if(o&&o.tagName==='OUTPUT')o.textContent=SLIDERS.find(s=>s[0]===k)[5](el.value)}
  invalidate();
});
$('ed-ems').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;draft.e.splice(+b.dataset.del,1);renderEms();invalidate()});
$('ed-add').onclick=()=>{if(draft.e.length<8){draft.e.push(mkEm('ring'));renderEms();invalidate()}};
document.querySelectorAll('input[name=ed-mode]').forEach(r=>r.addEventListener('change',()=>{draft.m=r.value;renderMode();invalidate()}));
$('ed-mv').addEventListener('change',()=>{draft.mv=+$('ed-mv').value;invalidate()});
$('ed-hp').addEventListener('input',()=>{draft.h=+$('ed-hp').value;$('ed-hp-o').textContent=draft.h;invalidate()});
for(const id of ['ed-name','ed-author','ed-dur'])$(id).addEventListener('input',()=>{draft.n=$('ed-name').value;draft.a=$('ed-author').value;if(+$('ed-dur').value!==draft.d){const o=draft.d,n=+$('ed-dur').value;for(const m of draft.e)if(m.e>=o)m.e=n;draft.d=n;renderEms();invalidate()}});
function invalidate(){draft.verified=false;updStatus()}
function updStatus(){
  const s=$('ed-status');
  if(draft.verified){s.className='status ok';s.textContent='クリア確認済み。投稿できます。'}
  else{s.className='status';s.textContent='投稿するには、まず自分でテストプレイしてクリアしてください。'}
  $('ed-post').disabled=!draft.verified;
}
$('ed-test').onclick=()=>{draft.n=$('ed-name').value;draft.a=$('ed-author').value;startGame(sanitize(draft),'test')};
$('ed-back').onclick=()=>{renderHome();show('home')};
$('ed-post').onclick=()=>{
  const st=sanitize({...draft,n:$('ed-name').value,a:$('ed-author').value});
  const code=enc(st);st.id=draft.id||('m'+hash(code));
  store.set('author',st.a);
  const idx=mine.findIndex(s=>s.id===st.id);if(idx>=0)mine[idx]=st;else mine.unshift(st);
  store.set('mine',mine);renderHome();show('home');openModal(code,st);
};

/* ---------- modal ---------- */
function xLen(t){let n=0;for(const ch of t)n+=ch.codePointAt(0)<0x1100?1:2;return n}
function openModal(code,st){
  $('m-code').value=code;$('m-msg').textContent='';
  const name=st?st.n:'弾幕ステージ',kind=st&&st.m==='boss'?'ボスを作った':'弾幕を作った';
  const text=`「${name}」の${kind}！クリアできる？\n#弾幕メーカー\n\n${code}`;
  $('m-x').href='https://x.com/intent/post?text='+encodeURIComponent(text);
  const over=xLen(text)>280;$('m-warn').hidden=!over;
  if(over)$('m-warn').textContent='このステージはコードが長く、Xの文字数制限を超える可能性があります。発射台を減らすと短くなります。';
  $('modal').hidden=false;
}
$('m-close').onclick=()=>{$('modal').hidden=true};
$('m-copy').onclick=()=>{
  const t=$('m-code');
  const fb=()=>{t.focus();t.select();$('m-msg').textContent='選択しました。長押しでコピーしてください。'};
  try{navigator.clipboard.writeText(t.value).then(()=>{$('m-msg').textContent='コピーしました'},fb)}catch(e){fb()}
};

/* ---------- game ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let dpr=1,game=null,raf=0,last=0,drag=null;
const stars=Array.from({length:70},(_,i)=>{const r=mulberry(i+7);return{x:r()*W,y:r()*H,s:r()*1.4+.3,v:r()*30+10}});
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;
  const b=$('stagebox'),s=Math.min(b.clientWidth/W,b.clientHeight/H)*.98;
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
}
window.addEventListener('resize',()=>{if(game)resize()});

function startGame(stage,mode){
  cancelAnimationFrame(raf);
  game={stage,mode,t:-1.2,bullets:[],p:{x:W/2,y:H*.85},em:stage.e.map(m=>({m,next:m.s,shot:0})),over:null,hp:stage.h||0,phase:1,banner:0,shots:[],cd:0,flash:0,keys:{},rng:mulberry(hash(JSON.stringify(stage.e)))};
  $('p-title').textContent=(mode==='test'?'テスト：':'')+stage.n;$('result').hidden=true;
  show('play');resize();
  if(mode==='play'){const s=stats[stage.id]||(stats[stage.id]={t:0,c:0});s.t++;store.set('stats',stats)}
  last=performance.now();raf=requestAnimationFrame(loop);
}
function loop(now){
  const g=game;if(!g)return;
  let dt=Math.min(.05,(now-last)/1000);last=now;
  while(dt>0&&!g.over){const h=Math.min(dt,1/120);step(h);dt-=h}
  draw();if(!g.over)raf=requestAnimationFrame(loop);
}
function emit(m,k,cx,cy,px,py,rng,out){
  const sp=m.v*60,col=PAL[m.k],n=Math.max(1,m.c),deg=Math.PI/180;
  const add=(x,y,a)=>{if(out.length<1600)out.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,col})};
  switch(m.t){
    case'ring':case'spiral':for(let j=0;j<n;j++)add(cx,cy,j*2*Math.PI/n+k*m.r*deg);break;
    case'aim':{const b=Math.atan2(py-cy,px-cx);for(let j=0;j<n;j++)add(cx,cy,b+(n>1?(j/(n-1)-.5)*m.r*deg:0));break}
    case'rain':for(let j=0;j<n;j++)add(rng()*W,-8,Math.PI/2+(rng()-.5)*.3);break;
    case'sweep':{const b=Math.PI/2+Math.sin(k*.25)*m.r*deg;for(let j=0;j<n;j++)add(cx,cy,b+(n>1?(j/(n-1)-.5)*.5:0));break}
  }
}
const MV=[[0,0],[.25,.6],[.32,1.3]];
function bossPos(g){const[a,w]=MV[g.stage.mv||0];return{x:W*(.5+a*Math.sin(Math.max(0,g.t)*w)),y:H*.18}}
function phaseOf(g){const r=g.hp/g.stage.h;return r>2/3?1:r>1/3?2:3}
function step(dt){
  const g=game,p=g.p,K=g.keys,boss=g.stage.m==='boss';g.t+=dt;
  const sp=(K.Shift?90:210)*dt;
  if(K.ArrowLeft||K.a)p.x-=sp;if(K.ArrowRight||K.d)p.x+=sp;if(K.ArrowUp||K.w)p.y-=sp;if(K.ArrowDown||K.s)p.y+=sp;
  p.x=clamp(p.x,6,W-6);p.y=clamp(p.y,6,H-6);
  const bp=boss?bossPos(g):null;
  if(boss){
    const ph=phaseOf(g);if(ph!==g.phase){g.phase=ph;if(ph>1){g.bullets.length=0;g.banner=1.2}}
    if(g.banner>0)g.banner-=dt;
    g.cd-=dt;if(g.t>=0&&g.cd<=0){g.cd=.09;g.shots.push({x:p.x-5,y:p.y-10},{x:p.x+5,y:p.y-10})}
    let w=0;for(const s of g.shots){s.y-=600*dt;if(s.y<-10)continue;const dx=s.x-bp.x,dy=s.y-bp.y;if(dx*dx+dy*dy<24*24){g.hp--;g.flash=.06;continue}g.shots[w++]=s}g.shots.length=w;
    if(g.flash>0)g.flash-=dt;
    if(g.hp<=0){finish(true);return}
  }
  if(g.t>=0)for(const E of g.em){
    const m=E.m;
    if(boss){
      if(!(m.ph===0||m.ph===g.phase)||g.banner>0){E.next=g.t;continue}
      while(g.t>=E.next){emit(m,E.shot,m.t==='rain'?0:bp.x,bp.y,p.x,p.y,g.rng,g.bullets);E.shot++;E.next+=Math.max(.05,m.i)}
    }else{
      const end=Math.min(m.e,g.stage.d);
      while(g.t>=E.next&&E.next<end){emit(m,E.shot,m.x*W,m.y*H,p.x,p.y,g.rng,g.bullets);E.shot++;E.next+=Math.max(.05,m.i)}
    }
  }
  const bs=g.bullets;let w=0;
  for(let i=0;i<bs.length;i++){const b=bs[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)continue;
    const dx=b.x-p.x,dy=b.y-p.y;if(dx*dx+dy*dy<30.25){finish(false);return}
    bs[w++]=b}
  bs.length=w;
  if(g.t>=g.stage.d)finish(boss?false:true,boss?'time':null);
}
function finish(win,why){
  const g=game;g.over=win?'win':'lose';const boss=g.stage.m==='boss';
  if(g.mode==='play'&&win){stats[g.stage.id].c++;store.set('stats',stats)}
  if(g.mode==='test'&&win){draft.verified=true;updStatus()}
  $('r-big').textContent=win?(boss?'撃破！':'CLEAR!'):(why==='time'?'時間切れ':'被弾…');$('r-big').className='big '+(win?'win':'lose');
  const tt=Math.max(0,g.t).toFixed(1);
  $('r-msg').textContent=g.mode==='test'?(win?'クリア確認完了。投稿できます。':'作った本人もクリアできないと投稿できません。'):
    win?(boss?`${tt}秒 でボスを撃破！`:`${g.stage.d}秒 耐えきった！`):why==='time'?`ボスの残りHP ${g.hp}`:`${tt}秒 で被弾`;
  $('result').hidden=false;
}
function drawBullets(c,bs){for(const b of bs){c.fillStyle=b.col;c.beginPath();c.arc(b.x,b.y,6,0,7);c.fill()}c.fillStyle='#fff';for(const b of bs){c.beginPath();c.arc(b.x,b.y,3,0,7);c.fill()}}
function drawBoss(c,x,y,flash){
  c.save();c.translate(x,y);c.fillStyle=flash?'#fff':'#ff6b9d';c.beginPath();
  for(let i=0;i<12;i++){const a=i*Math.PI/6,r=i%2?14:22;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath();c.fill();
  c.fillStyle='#0a0818';c.beginPath();c.arc(0,0,7,0,7);c.fill();c.restore();
}
function drawShip(c,x,y){c.fillStyle='#5ce1e6';c.beginPath();c.moveTo(x,y-11);c.lineTo(x+8,y+8);c.lineTo(x,y+4);c.lineTo(x-8,y+8);c.closePath();c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x,y,2.5,0,7);c.fill()}
function draw(){
  const g=game,boss=g.stage.m==='boss';ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0a0818';ctx.fillRect(0,0,W,H);
  const tt=performance.now()/1000;
  ctx.fillStyle='#3a3270';for(const s of stars){ctx.fillRect(s.x,(s.y+tt*s.v)%H,s.s,s.s)}
  if(boss){const bp=bossPos(g);drawBoss(ctx,bp.x,bp.y,g.flash>0);ctx.fillStyle='#ffd166';for(const s of g.shots)ctx.fillRect(s.x-1.5,s.y-6,3,10)}
  else{for(const E of g.em){if(E.m.t==='rain')continue;const st=E.m.s,en=Math.min(E.m.e,g.stage.d),lead=st-g.t;
    if(g.t>=en||lead>.6)continue;
    ctx.globalAlpha=lead>0?(Math.floor(lead*10)%2?.15:.7):.35;ctx.strokeStyle=PAL[E.m.k];const x=E.m.x*W,y=E.m.y*H;ctx.beginPath();ctx.moveTo(x,y-7);ctx.lineTo(x+7,y);ctx.lineTo(x,y+7);ctx.lineTo(x-7,y);ctx.closePath();ctx.stroke()}ctx.globalAlpha=1}
  drawShip(ctx,g.p.x,g.p.y);
  drawBullets(ctx,g.bullets);
  ctx.fillStyle='#332b62';ctx.fillRect(0,0,W,5);
  if(boss){ctx.fillStyle='#ff6b9d';ctx.fillRect(0,0,W*Math.max(0,g.hp)/g.stage.h,5);ctx.fillStyle='#0a0818';ctx.fillRect(W/3-1,0,2,5);ctx.fillRect(W*2/3-1,0,2,5)}
  else{ctx.fillStyle='#ffd166';ctx.fillRect(0,0,W*clamp(g.t/g.stage.d,0,1),5)}
  ctx.textAlign='center';ctx.font='28px "DotGothic16",monospace';ctx.fillStyle='#efeaff';
  if(g.t<0)ctx.fillText('READY',W/2,H/2);
  else if(boss&&g.banner>0){ctx.fillStyle='#ffd166';ctx.fillText('第'+g.phase+'段階',W/2,H/2)}
  $('p-time').textContent=Math.max(0,g.stage.d-Math.max(0,g.t)).toFixed(1);
}
/* ---------- editor previews: each emitter card loops its own pattern ---------- */
const PH=330;let pv=[],pvRaf=0,pvLast=0;
function setupPreviews(){
  pv=[...document.querySelectorAll('#ed-ems canvas.pv')].map((c,i)=>({c,i,b:[],t:0,next:0,shot:0,rng:mulberry(i+1)}));
  cancelAnimationFrame(pvRaf);pvLast=performance.now();if(pv.length)pvRaf=requestAnimationFrame(pvLoop);
}
function pvLoop(now){
  if($('edit').hidden){pvRaf=0;return}
  const dt=Math.min(.05,(now-pvLast)/1000);pvLast=now;
  const r=Math.min(window.devicePixelRatio||1,2);
  for(const P of pv){
    const m=draft.e[P.i];if(!m)continue;
    const boss=draft.m==='boss';P.t+=dt;
    const px=W/2+Math.sin(P.t*.9)*90,py=PH-40;
    const cx=boss?W/2:m.x*W,cy=boss?H*.18:m.y*H;
    while(P.t>=P.next){emit(m,P.shot,cx,cy,px,py,P.rng,P.b);P.shot++;P.next+=Math.max(.05,m.i)}
    let w=0;for(const b of P.b){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-20||b.x>W+20||b.y<-20||b.y>PH+20)continue;P.b[w++]=b}P.b.length=w;
    const c=P.c,cw=c.clientWidth;if(!cw)continue;
    if(c.width!==Math.round(cw*r)){c.width=Math.round(cw*r);c.height=Math.round(cw*PH/W*r)}
    const x=c.getContext('2d'),s=c.width/W;x.setTransform(s,0,0,s,0,0);
    x.fillStyle='#0a0818';x.fillRect(0,0,W,PH);
    if(boss)drawBoss(x,cx,cy,false);
    else if(m.t!=='rain'){x.strokeStyle=PAL[m.k];x.lineWidth=2;x.beginPath();x.moveTo(cx,cy-8);x.lineTo(cx+8,cy);x.lineTo(cx,cy+8);x.lineTo(cx-8,cy);x.closePath();x.stroke()}
    drawShip(x,px,py);drawBullets(x,P.b);
  }
  pvRaf=requestAnimationFrame(pvLoop);
}
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(x){}});
$('stagebox').addEventListener('pointerdown',e=>{if(e.target===$('stagebox'))drag={x:e.clientX,y:e.clientY}});
window.addEventListener('pointermove',e=>{if(!drag||!game||game.over)return;const r=cv.getBoundingClientRect(),f=W/r.width;game.p.x+=(e.clientX-drag.x)*f*1.2;game.p.y+=(e.clientY-drag.y)*f*1.2;drag={x:e.clientX,y:e.clientY}});
for(const ev of ['pointerup','pointercancel'])window.addEventListener(ev,()=>{drag=null});
const KEYS=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Shift','a','d','w','s'];
window.addEventListener('keydown',e=>{if(game&&!$('play').hidden&&KEYS.includes(e.key)){game.keys[e.key]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{if(game)game.keys[e.key]=false});
function leave(){const g=game;cancelAnimationFrame(raf);game=null;if(g&&g.mode==='test'){show('edit');setupPreviews()}else{renderHome();show('home')}}
$('p-quit').onclick=leave;$('r-back').onclick=leave;
$('r-retry').onclick=()=>{const g=game;startGame(g.stage,g.mode)};

renderHome();
</script>
