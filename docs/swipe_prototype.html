<title>スワイプ弾幕</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 一枚のゲーム画面（縦長 360×540）を画面いっぱいに置く。夜のゲームセンターの一色だけで作る（テーマ切替なし） */
:root{
  --bg:#07040f; --panel:#140b28; --ink:#f6f1ff; --dim:#a597cf;
  --pink:#ff4f9a; --cyan:#3ee8ff; --gold:#ffd23f;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
#app{height:100%;display:grid;place-items:center}
#stage{--u:1;position:relative;overflow:hidden;border-radius:calc(var(--u)*18px);touch-action:none;user-select:none;-webkit-user-select:none;
  background:var(--bg);box-shadow:0 0 0 1px #2c1f52,0 30px 90px -30px #ff4f9a88,0 0 120px -40px #3ee8ff66;max-width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ui{position:absolute;font-size:calc(var(--u)*12px)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.rail{right:calc(var(--u)*8px);bottom:calc(var(--u)*96px);display:flex;flex-direction:column;gap:calc(var(--u)*12px);align-items:center}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3px);background:none;border:0;padding:0;cursor:pointer}
.rbtn .ic{width:calc(var(--u)*42px);height:calc(var(--u)*42px);border-radius:50%;display:grid;place-items:center;
  background:#0b0618b3;border:1px solid #ffffff26;backdrop-filter:blur(4px);transition:transform .12s}
.rbtn:active .ic{transform:scale(.88)}
.rbtn svg{width:52%;height:52%}
.rbtn .lb{font-size:calc(var(--u)*9.5px);font-weight:700;color:var(--ink);text-shadow:0 1px 3px #000}
.rbtn.on .ic{background:var(--pink);border-color:var(--pink)}

.info{left:calc(var(--u)*12px);right:calc(var(--u)*64px);bottom:calc(var(--u)*12px);pointer-events:none;text-shadow:0 1px 4px #000}
.info .nm{font-family:var(--display);font-size:calc(var(--u)*17px);line-height:1.2;text-wrap:balance}
.info .au{font-weight:700;font-size:calc(var(--u)*12px);color:var(--cyan);margin-top:calc(var(--u)*3px)}
.info .st{font-size:calc(var(--u)*10.5px);color:var(--dim);margin-top:calc(var(--u)*3px);font-variant-numeric:tabular-nums}

.skip{top:calc(var(--u)*44px);right:calc(var(--u)*8px);background:#0b0618b3;border:1px solid #ffffff26;border-radius:999px;
  padding:calc(var(--u)*4px) calc(var(--u)*10px);font-weight:700;font-size:calc(var(--u)*10.5px);cursor:pointer}
.hint{left:0;right:0;bottom:calc(var(--u)*78px);text-align:center;font-weight:900;font-size:calc(var(--u)*12px);letter-spacing:.06em;
  text-shadow:0 1px 4px #000;pointer-events:none;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-5px))}}

.title{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*14px);text-align:center;
  background:radial-gradient(ellipse at 50% 40%,#2a0f4acc,#07040fee 70%);cursor:pointer;padding:0 calc(var(--u)*20px)}
.title .eyebrow{font-weight:900;font-size:calc(var(--u)*11px);letter-spacing:.3em;color:var(--cyan)}
.title h1{margin:0;font-family:var(--display);font-weight:400;font-size:calc(var(--u)*46px);line-height:1.02;
  background:linear-gradient(180deg,#fff 10%,var(--gold) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #3b0d2a) drop-shadow(0 0 18px #ff4f9a88)}
.title .go{font-family:var(--display);font-size:calc(var(--u)*18px);color:var(--ink);padding:calc(var(--u)*10px) calc(var(--u)*26px);
  border-radius:999px;background:var(--pink);box-shadow:0 0 0 3px #ff4f9a44,0 0 30px #ff4f9a;animation:pulse 1.1s ease-in-out infinite;border:0;cursor:pointer}
@keyframes pulse{50%{transform:scale(1.07)}}
.title ul{list-style:none;margin:0;padding:0;display:grid;gap:calc(var(--u)*5px);font-size:calc(var(--u)*11.5px);color:var(--dim);font-weight:700}
.title ul b{color:var(--ink)}
.title .best{font-size:calc(var(--u)*11px);color:var(--gold);font-weight:900}

.toast{left:50%;top:42%;transform:translateX(-50%);background:#000c;border:1px solid #ffffff2a;border-radius:12px;padding:calc(var(--u)*8px) calc(var(--u)*12px);
  font-weight:700;font-size:calc(var(--u)*11px);max-width:80%;text-align:center;pointer-events:none}
@media (prefers-reduced-motion:reduce){.hint,.title .go{animation:none}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div class="ui info" id="info" hidden>
      <div class="nm" id="iName"></div>
      <div class="au" id="iAuthor"></div>
      <div class="st" id="iStats"></div>
    </div>

    <div class="ui rail" id="rail" hidden>
      <button class="rbtn" id="bLike" aria-label="いいね">
        <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg></span>
        <span class="lb" id="likeN">0</span>
      </button>
      <button class="rbtn" id="bFull" aria-label="フル版で遊ぶ">
        <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg></span>
        <span class="lb">フル版</span>
      </button>
      <button class="rbtn" id="bShare" aria-label="共有">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v6h14v-6"/></svg></span>
        <span class="lb">共有</span>
      </button>
      <button class="rbtn" id="bSound" aria-label="音のオンとオフ">
        <span class="ic" id="soundIc"></span>
        <span class="lb" id="soundLb">音あり</span>
      </button>
    </div>

    <button class="ui skip" id="bSkip" hidden>スキップ ›</button>
    <div class="ui hint" id="hint" hidden>↑ スワイプで次へ　↓ もう一度</div>

    <div class="ui title" id="title">
      <div class="eyebrow">弾幕メーカー 新モード試作</div>
      <h1>スワイプ<br>弾幕</h1>
      <ul>
        <li><b>10秒</b>生き残ればクリア</li>
        <li>弾を<b>ギリギリでかする</b>と点が増える</li>
        <li>かすり40回で<b>ボム</b>が勝手に出る</li>
        <li>ドラッグで移動（PCは矢印キー、Shiftで低速）</li>
      </ul>
      <button class="go" id="bStart">タップでスタート</button>
      <div class="best" id="titleBest"></div>
    </div>

    <div class="ui toast" id="toast" hidden></div>
  </div>
</div>

<script>
(() => {
'use strict';
// ───────── 定数（論理画面は本編と同じ 360×540、計算は 1/120 秒刻み）
const W = 360, H = 540, DT = 1 / 120, CLIP = 10;
const HIT2 = 5.5 * 5.5, GRAZE = 18, GRAZE2 = GRAZE * GRAZE;
const BOMB_AT = 40;
const COLS = ['#ff4f9a', '#3ee8ff', '#ffd23f', '#b36bff', '#5dff8f', '#ff8a3d'];
const DISPLAY = '"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif';
const BODY = '"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;

function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fx = Math.random; // 演出用の乱数（計算には使わない）

// ───────── 作り物のステージ（本番は世界のステージから切り出す）
const NAMES = ['桜吹雪の檻', '深夜2時の渦', 'ネオン地獄', '無理ゲーじゃない', 'きらきら星屑', '回転寿司', '台風13号', '逃げ場はある',
  'ゆるふわ殺意', '虹色ミキサー', '花火大会の最前列', '流星群', 'ピンボール地獄', '真空の舞', '月夜の蜂', '加速する恋', '曼荼羅', '夏の終わりの線香花火'];
const AUTHORS = ['@mochi_dan', '@kuro_neko', '@yuzu_stg', '@hanabi_p', '@tsukimi', '@pixel_rain', '@ame_dama', '@shiro_maker', '@nagi', '@kirara_77'];
const PATS = ['ring', 'spiral', 'aim', 'rain', 'sweep', 'flower', 'curve', 'accel'];
const FULL = ['耐えきる 30秒', '耐えきる 60秒', 'ボスを倒す 90秒', '耐えきる 45秒', 'ボスを倒す 60秒', '連戦 4場面'];

function genStage(i) {
  const r = rng(i * 7919 + 13);
  const d = Math.min(1, 0.22 + i * 0.045) + r() * 0.22;
  const n = 2 + Math.floor(r() * 2) + (d > 0.85 ? 1 : 0);
  const em = [];
  for (let k = 0; k < n; k++) {
    const p = PATS[Math.floor(r() * PATS.length)];
    const e = { p, x: W * (0.14 + r() * 0.72), y: H * (0.07 + r() * 0.24), c: 0, i: 1, v: 100, r: 0, col: Math.floor(r() * COLS.length), ang0: r() * TAU, ph: r() * TAU, sign: r() < 0.5 ? -1 : 1 };
    switch (p) {
      case 'ring': e.i = 1.15 - 0.5 * d; e.c = 10 + Math.floor(d * 12); e.v = 80 + 60 * d; e.r = 0.12 + r() * 0.3; break;
      case 'spiral': e.i = 0.095 - 0.03 * d; e.c = 2 + Math.floor(d * 3); e.v = 85 + 50 * d; e.r = (0.16 + r() * 0.12) * e.sign; break;
      case 'aim': e.i = 0.95 - 0.4 * d; e.c = 3 + 2 * Math.floor(d * 2); e.v = 150 + 70 * d; e.r = 0.45 + r() * 0.45; break;
      case 'rain': e.i = 0.3 - 0.14 * d; e.c = 1 + Math.floor(d * 2); e.v = 90 + 60 * d; break;
      case 'sweep': e.i = 0.15 - 0.05 * d; e.c = 3 + Math.floor(d * 2); e.v = 110 + 50 * d; e.r = 0.65 + r() * 0.5; break;
      case 'flower': e.i = 1.3 - 0.5 * d; e.c = 12 + Math.floor(d * 8); e.v = 70 + 40 * d; e.r = 0.2; break;
      case 'curve': e.i = 0.75 - 0.3 * d; e.c = 8 + Math.floor(d * 8); e.v = 70 + 40 * d; e.r = 0.9; break;
      case 'accel': e.i = 1.0 - 0.35 * d; e.c = 10 + Math.floor(d * 8); e.v = 30; e.r = 0.25; break;
    }
    e.next0 = r() * e.i;
    em.push(e);
  }
  const plays = Math.floor(200 + r() * 40000);
  return { i, em, d, pre: 3 + r() * 3, name: NAMES[i % NAMES.length], author: AUTHORS[Math.floor(r() * AUTHORS.length)],
    plays, rate: Math.round(8 + r() * 60), likes: Math.floor(plays * (0.02 + r() * 0.08)), full: FULL[Math.floor(r() * FULL.length)] };
}

// ───────── 弾の発射と移動
function shoot(c, x, y, a, v, col, size, extra) {
  const b = { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, col, s: size, g: 0, turn: 0, acc: 0, max: 0 };
  if (extra) Object.assign(b, extra);
  c.b.push(b);
}
function emit(e, c) {
  switch (e.p) {
    case 'ring': case 'spiral':
      for (let k = 0; k < e.c; k++) shoot(c, e.x, e.y, e.ang + k * TAU / e.c, e.v, e.col, e.p === 'ring' ? 5 : 4);
      e.ang += e.r; break;
    case 'flower':
      for (let k = 0; k < e.c * 2; k++) shoot(c, e.x, e.y, e.ang + k * TAU / (e.c * 2), e.v * (k % 2 ? 0.62 : 1), k % 2 ? (e.col + 1) % COLS.length : e.col, k % 2 ? 4 : 6);
      e.ang += e.r; break;
    case 'aim': {
      const base = Math.atan2(c.py - e.y, c.px - e.x);
      for (let k = 0; k < e.c; k++) shoot(c, e.x, e.y, base + (e.c > 1 ? (k / (e.c - 1) - 0.5) * e.r : 0), e.v, e.col, 4.5);
      break;
    }
    case 'rain':
      for (let k = 0; k < e.c; k++) shoot(c, c.rng() * W, -8, Math.PI / 2 + (c.rng() - 0.5) * 0.25, e.v * (0.7 + c.rng() * 0.6), e.col, 5);
      break;
    case 'sweep': {
      const base = Math.PI / 2 + Math.sin(c.t * 1.6 + e.ph) * e.r;
      for (let k = 0; k < e.c; k++) shoot(c, e.x, e.y, base + (k / Math.max(1, e.c - 1) - 0.5) * 0.5, e.v, e.col, 4);
      break;
    }
    case 'curve':
      for (let k = 0; k < e.c; k++) shoot(c, e.x, e.y, e.ang + k * TAU / e.c, e.v, e.col, 5, { turn: e.r * e.sign });
      e.sign = -e.sign; e.ang += 0.2; break;
    case 'accel':
      for (let k = 0; k < e.c; k++) shoot(c, e.x, e.y, e.ang + k * TAU / e.c, e.v, e.col, 4.5, { acc: 160, max: 260 });
      e.ang += e.r; break;
  }
}
// live=false: 早送り・見本用（当たり判定もかすりもなし）
function simStep(c, live) {
  c.t += DT;
  for (const e of c.em) while (c.t >= e.next) { emit(e, c); e.next += e.i; }
  const px = c.px, py = c.py, guard = c.shield > 0;
  let hit = false, w = 0;
  const bs = c.b;
  for (let k = 0; k < bs.length; k++) {
    const b = bs[k];
    if (b.turn) { const ca = Math.cos(b.turn * DT), sa = Math.sin(b.turn * DT), vx = b.vx * ca - b.vy * sa; b.vy = b.vx * sa + b.vy * ca; b.vx = vx; }
    if (b.acc) { const sp = Math.hypot(b.vx, b.vy), ns = Math.min(b.max, sp + b.acc * DT); b.vx *= ns / sp; b.vy *= ns / sp; }
    b.x += b.vx * DT; b.y += b.vy * DT;
    if (b.x < -20 || b.x > W + 20 || b.y < -30 || b.y > H + 20) continue;
    if (live) {
      const dx = b.x - px, dy = b.y - py, d2 = dx * dx + dy * dy;
      if (d2 < HIT2 && !guard) hit = true;
      else if (!b.g && d2 < GRAZE2) { b.g = 1; graze(c, b); }
    }
    bs[w++] = b;
  }
  bs.length = w;
  if (bs.length > 1400) bs.splice(0, bs.length - 1400);
  return hit;
}

// 1本ぶんを作る: 途中まで早送りして、自機を一番安全な場所に置く
function makeClip(i) {
  const st = genStage(i);
  const c = { st, em: st.em.map(e => ({ ...e, next: e.next0, ang: e.ang0 })), rng: rng(i * 31 + 5), b: [], t: 0,
    px: W / 2, py: H * 0.85, coins: [], clipT: 0, freeze: 0.5, shield: 0.7, dead: false, combo: 0, lastG: -9, mult: 1, grazes: 0 };
  const steps = Math.round(st.pre / DT);
  for (let k = 0; k < steps; k++) simStep(c, false);
  let best = -1, bx = W / 2, by = H * 0.85;
  for (let gx = 0; gx < 12; gx++) for (let gy = 0; gy < 8; gy++) {
    const x = 30 + gx * 300 / 11, y = H * 0.5 + gy * H * 0.42 / 7;
    let m = 1e9;
    for (const b of c.b) for (const k of [0, 0.3, 0.6]) {
      const dx = b.x + b.vx * k - x, dy = b.y + b.vy * k - y, d = dx * dx + dy * dy;
      if (d < m) m = d;
    }
    const score = Math.sqrt(m) - Math.abs(x - W / 2) * 0.03;
    if (score > best) { best = score; bx = x; by = y; }
  }
  c.px = bx; c.py = by;
  return c;
}

// ───────── 状態
const S = { state: 'title', idx: 0, streak: 0, best: 0, score: 0, shownScore: 0, gauge: 0, played: 0, slowT: 0, resT: 0, transP: 0, liked: new Set(), sound: true };
try { S.best = +localStorage.getItem('swipe-danmaku-best') || 0; } catch (e) {}
let g = null;
const parts = [], pops = [], banners = [], shocks = [];
let shake = 0, flashA = 0, flashC = '#fff';
const stars = Array.from({ length: 90 }, () => ({ x: fx() * W, y: fx() * H, z: fx() }));

// ───────── 音（Web Audio で作る。外部ファイルなし）
let ac = null, master = null, lastBlip = 0, lastCoin = 0, coinN = 0;
function initAudio() {
  if (ac) return;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination); } catch (e) { ac = null; }
}
function tone(f, dur, type = 'square', vol = 0.05, f2 = 0, delay = 0) {
  if (!ac || !S.sound) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), gn = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn).connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, freq, freq2 = 0) {
  if (!ac || !S.sound) return;
  const t = ac.currentTime, len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / len);
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
  src.buffer = buf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); if (freq2) f.frequency.exponentialRampToValueAtTime(freq2, t + dur);
  gn.gain.value = vol; src.connect(f).connect(gn).connect(master); src.start(t);
}
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

// ───────── 演出の部品
function burst(x, y, n, cols, spd, life, size = 2.5, grav = 0) {
  for (let k = 0; k < n; k++) {
    const a = fx() * TAU, v = spd * (0.3 + fx() * 0.7);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, col: cols[Math.floor(fx() * cols.length)], s: size * (0.6 + fx() * 0.8), grav, rot: fx() * TAU, conf: false });
  }
}
function confetti(n) {
  for (let k = 0; k < n; k++) parts.push({ x: fx() * W, y: -10 - fx() * 80, vx: (fx() - 0.5) * 80, vy: 80 + fx() * 160, life: 2.2, max: 2.2,
    col: COLS[Math.floor(fx() * COLS.length)], s: 3 + fx() * 3, grav: 60, rot: fx() * TAU, conf: true });
}
function banner(txt, col, size, y = H * 0.4, dur = 0.9, delay = 0) { banners.push({ txt, col, size, y, t: -delay, dur }); }
function pop(x, y, txt, col, size = 11) { if (pops.length < 40) pops.push({ x, y, txt, col, size, t: 0, dur: 0.6 }); }
function addShake(v) { shake = Math.max(shake, REDUCED ? v * 0.25 : v); }
function flash(col, a) { flashC = col; flashA = Math.max(flashA, REDUCED ? a * 0.4 : a); }

// ───────── ゲームのできごと
function graze(c, b) {
  c.combo = c.t - c.lastG < 1.5 ? c.combo + 1 : 1;
  c.lastG = c.t; c.grazes++;
  const m = Math.min(8, 1 + Math.floor(c.combo / 10));
  if (m > c.mult) {
    banner('×' + m, m >= 6 ? '#ff4f9a' : m >= 4 ? '#ffd23f' : '#3ee8ff', 64 + m * 4, H * 0.36, 0.7);
    tone(523, 0.18, 'triangle', 0.06); tone(659, 0.18, 'triangle', 0.05, 0, 0.04); tone(784 * (1 + (m - 2) * 0.06), 0.3, 'triangle', 0.06, 0, 0.08);
    addShake(5); buzz(15);
  }
  c.mult = m;
  const pts = 5 * c.mult;
  S.score += pts;
  burst(b.x, b.y, 4, ['#fff', COLS[b.col]], 140, 0.3, 2);

    text(c.combo + ' COMBO', W / 2, 108, 18 + Math.min(14, c.combo * 0.25), c.combo >= 30 ? '#ff4f9a' : c.combo >= 15 ? '#ffd23f' : '#fff', { alpha: a, scale: 1 + kick });
  }
  // ボムのゲージ（左端）
  const gy = H * 0.3, gh = H * 0.4, k = S.gauge / BOMB_AT;
  ctx.fillStyle = '#ffffff12'; ctx.fillRect(4, gy, 5, gh);
  ctx.fillStyle = k > 0.8 ? (Math.floor(performance.now() / 90) % 2 ? '#fff' : '#ffd23f') : '#ffd23f';
  ctx.fillRect(4, gy + gh * (1 - k), 5, gh * k);
  ctx.save(); ctx.translate(17, gy + gh / 2); ctx.rotate(-Math.PI / 2);
  text('BOMB', 0, 0, 8, '#ffd23f', { alpha: 0.4 + k * 0.6, stroke: false, font: BODY, weight: 900 }); ctx.restore();
}
function drawBanners() {
  for (const b of banners) {
    if (b.t < 0) continue;
    const k = b.t / b.dur;
    const s = b.t < 0.1 ? 0.3 + (b.t / 0.1) * 1.1 : 1.4 - Math.min(0.4, (b.t - 0.1) * 3);
    const a = k > 0.75 ? 1 - (k - 0.75) * 4 : 1;
    text(b.txt, W / 2, b.y, b.size, b.col, { scale: s, alpha: a, glow: b.col, rot: Math.sin(b.t * 30) * 0.04 * Math.max(0, 1 - b.t * 4) });
  }
}
function drawScene(c, offY) {
  ctx.save();
  ctx.translate(0, offY);
  if (shake) ctx.translate((fx() - 0.5) * shake, (fx() - 0.5) * shake);
  drawBackground(c);
  if (c) {
    drawEmitters(c); drawBullets(c); drawCoins(c); drawShip(c); drawFx();
    if (S.state !== 'title') drawHud(c);
    drawBanners();
  }
  ctx.restore();
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (S.state === 'trans') {
    const p = 1 - Math.pow(1 - Math.min(1, S.transP), 3);
    ctx.fillStyle = '#07040f'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(snap, 0, -p * cv.height);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    drawScene(g, (1 - p) * H);
    return;
  }
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  drawScene(g, 0);
  if (S.state === 'freeze') { ctx.fillStyle = '#07040f'; ctx.globalAlpha = 0.25; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; drawBanners(); }
  if (flashA > 0.01) { ctx.fillStyle = flashC; ctx.globalAlpha = flashA; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (S.slowT > 0) { // スローモーション中は周りを暗く
    const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(40,0,20,.6)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
}
function frame(now) {
  const rd = Math.min(0.05, (now - last) / 1000); last = now;
  update(rd); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
