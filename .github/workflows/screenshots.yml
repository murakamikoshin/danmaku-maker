# 見た目の確認用: シミュレーター(iPhone と iPad)で主な画面を撮って、画像を成果物として保存する。署名もアップロードもしない。
# 手動実行(Actions タブ → UI Screenshots → Run workflow)。バナーはテスト広告で、-force-banner で場所を出す。
name: UI Screenshots
on:
  workflow_dispatch:
    inputs:
      device:
        description: iphone か ipad
        default: ipad
jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore Firebase config
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$PLIST" | base64 --decode > DanmakuApp/GoogleService-Info.plist
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          # コンパイルエラーが見えるように、エラーの行と結果だけを出す(全部のログは成果物に入れる)
          set +e
          xcodebuild build -project DanmakuMaker.xcodeproj -scheme DanmakuApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1
          rc=$?
          mkdir -p shots
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/build.log" | sort -u | head -80 | tee shots/build_errors.txt
          exit $rc
      - name: Take screenshots
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/*.app | head -1)
          BID=com.koshin.danmakumaker
          mkdir -p shots
          pick() { xcrun simctl list devices available | grep "$1" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'; }
          # DEVICE=ipad のときは iPad(審査と同じ iPad Air 11インチ)で、バナー(テスト広告)を出した状態を撮る
          if [ "${DEVICE:-iphone}" = "ipad" ]; then UDID=$(pick "iPad Air 11"); [ -n "$UDID" ] || UDID=$(pick "iPad Air"); ADS="-force-banner"; else UDID=$(pick "iPhone"); ADS="-no-ads"; fi
          echo "device => $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          shot() {  # 名前, 言語, 待つ秒数, 起動引数...
            name=$1; lang=$2; wait=$3; shift 3
            xcrun simctl terminate "$UDID" $BID || true
            xcrun simctl launch "$UDID" $BID $ADS -no-audio -no-debug-overlay -uitest-invincible -AppleLanguages "($lang)" "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/${DEVICE:-iphone}_${lang}_${name}.png"
          }
          shot home ja 20 -swipe-on
          shot shop ja 20 -open-shop
          shot shop_bosses ja 20 -open-shop -shop-bosses
          shot shop_patterns ja 20 -open-shop -shop-focus patterns
          shot settings ja 20 -open-settings
          shot editor ja 20 -open-editor
          shot play ja 20 -open-stage o16
          shot swipe ja 20 -open-swipe
          shot store ja 20 -open-store
          shot shop en 20 -open-shop
          shot arcade_shop ja 20 -ui-theme arcade -open-shop
          shot gensou_shop ja 20 -ui-theme gensou -open-shop
          xcrun simctl shutdown "$UDID" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
