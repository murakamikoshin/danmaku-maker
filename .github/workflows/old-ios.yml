# 古い iOS(iOS 15)での見た目の確認: iPad mini 4・iPhone 6s / 初代 SE などのために、iOS 15 のシミュレーターで、
# 1) 主な画面を起動引数で直接開いて撮る(テーマ 3 つ・長い言語・バナーあり)
# 2) 導線のテスト(FlowUITests・EditorFlowUITests)を回して、1 画面ごとに撮る
# 画像は成果物(old-ios-shots)に保存する。署名もアップロードもしない。
# iOS 15 のシミュレーターを動かすため、macos-15 の Xcode 16 を使う(Xcode 26 は iOS 15 のシミュレーターに対応しない)。
name: Old iOS UI Check
on:
  workflow_dispatch:
  push:
    branches: [ranked-match]
    paths: [".github/workflows/old-ios.yml"]
jobs:
  old-ios:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install iOS 15 simulator
        run: |
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes | grep -q "iOS 15"; then
            sudo xcodes runtimes install "iOS 15.5" || xcodes runtimes install "iOS 15.5"
          fi
          xcrun simctl list runtimes
          RT=$(xcrun simctl list runtimes | grep -E "^iOS 15" | tail -1 | sed -E 's/.* - (com\.apple[^ ]+).*/\1/')
          echo "runtime => $RT"
          # 画面がいちばん小さい iPhone(初代 SE: 320×568)と、iPad mini 4 と同じ大きさの iPad(768×1024)
          SE=$(xcrun simctl create "Old SE" "iPhone SE (1st generation)" "$RT")
          IP8=$(xcrun simctl create "Old 8" "iPhone 8" "$RT")
          MINI=$(xcrun simctl create "Old mini" "iPad mini (5th generation)" "$RT" || xcrun simctl create "Old mini" "iPad Air 2" "$RT")
          [ -n "$SE" ] && [ -n "$IP8" ] && [ -n "$MINI" ]
          echo "SE=$SE" >> $GITHUB_ENV; echo "IP8=$IP8" >> $GITHUB_ENV; echo "MINI=$MINI" >> $GITHUB_ENV
          echo "SE=$SE IP8=$IP8 MINI=$MINI"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install tools
        run: |
          brew install xcodegen
          npm i -g firebase-tools
          (cd firebase/functions && npm ci && npm run build)
      - name: Restore Firebase config
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$PLIST" | base64 --decode > DanmakuApp/GoogleService-Info.plist
      - name: Generate project
        run: xcodegen generate
      - name: Build for testing
        run: |
          set +e
          xcodebuild build-for-testing -project DanmakuMaker.xcodeproj -scheme DanmakuApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1
          rc=$?
          mkdir -p out
          grep -E "error:|TEST BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/build.log" | sort -u | head -80 | tee out/build_errors.txt
          exit $rc
      - name: Screens (起動引数で直接開く)
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/*.app | grep -v Runner | head -1)
          BID=com.koshin.danmakumaker
          mkdir -p out/screens
          shoot_all() {  # 端末名 UDID
            dev=$1; UDID=$2
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            shot() {  # 名前 言語 待つ秒数 起動引数...
              name=$1; lang=$2; wait=$3; shift 3
              xcrun simctl terminate "$UDID" $BID 2>/dev/null || true
              xcrun simctl launch "$UDID" $BID -no-audio -no-debug-overlay -uitest-invincible -force-banner \
                -AppleLanguages "($lang)" "$@" > /dev/null
              sleep "$wait"
              xcrun simctl io "$UDID" screenshot "out/screens/${dev}_${lang}_${name}.png" > /dev/null 2>&1
            }
            for th in arcade gensou classic; do
              shot ${th}_home ja 16 -ui-theme $th -swipe-on -battle-on
              shot ${th}_editor ja 18 -ui-theme $th -open-editor
              shot ${th}_sequence ja 18 -ui-theme $th -open-sequence-editor
              shot ${th}_shop ja 16 -ui-theme $th -open-shop
              shot ${th}_shop_bosses ja 16 -ui-theme $th -open-shop -shop-bosses
              shot ${th}_shop_patterns ja 18 -ui-theme $th -open-shop -shop-focus patterns
              shot ${th}_settings ja 16 -ui-theme $th -open-settings
              shot ${th}_play ja 18 -ui-theme $th -open-stage o16
              shot ${th}_result ja 45 -ui-theme $th -open-stage o01
              shot ${th}_store ja 16 -ui-theme $th -open-store
              shot ${th}_swipe ja 16 -ui-theme $th -open-swipe
              shot ${th}_battle ja 16 -ui-theme $th -battle-on -open-battle
            done
            shot arcade_swipe_stamina ja 16 -ui-theme arcade -open-swipe -swipe-stamina-sheet
            # 文字が長い言語
            for lang in en de ru es; do
              shot arcade_home $lang 16 -ui-theme arcade -swipe-on -battle-on
              shot arcade_shop $lang 16 -ui-theme arcade -open-shop
              shot arcade_editor $lang 18 -ui-theme arcade -open-editor
              shot arcade_settings $lang 16 -ui-theme arcade -open-settings
            done
            xcrun simctl shutdown "$UDID" || true
          }
          shoot_all se "$SE"
          shoot_all mini "$MINI"
          shoot_all ip8 "$IP8"
          ls out/screens | wc -l
      - name: Flows (導線のテストを iOS 15 で回す)
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: "120"
        run: |
          mkdir -p flow
          cat > run_flows.sh <<'EOS'
          #!/bin/bash
          run() {  # 名前 端末UDID テーマ テスト
            name=$1; udid=$2; theme=$3; only=$4
            export TEST_RUNNER_UI_THEME=$theme TEST_RUNNER_UI_BACKEND=emulator
            xcodebuild test-without-building -project DanmakuMaker.xcodeproj -scheme DanmakuApp \
              -derivedDataPath "$RUNNER_TEMP/dd" -destination "id=$udid" -only-testing:$only \
              -resultBundlePath "flow/$name.xcresult" > "flow/$name.log" 2>&1
            echo "$name => exit $?"
            grep -E "error: |Test Case .* (passed|failed)" "flow/$name.log" | sed -E 's/^.*(Test Case)/\1/' | head -40
          }
          run se_arcade   "$SE"   arcade  DanmakuAppUITests/FlowUITests
          run se_classic  "$SE"   classic DanmakuAppUITests/FlowUITests
          run mini_gensou "$MINI" gensou  DanmakuAppUITests/FlowUITests
          run se_editor   "$SE"   arcade  DanmakuAppUITests/EditorFlowUITests
          exit 0
          EOS
          chmod +x run_flows.sh
          export SE MINI
          cd firebase && firebase emulators:exec --only auth,firestore,functions,storage,database --project demo-danmaku \
            "cd .. && ./run_flows.sh" | grep -vE "^\s*$" | grep -E "=> exit|Test Case|error: " | tee ../out/flow_summary.txt
      - name: Export flow screenshots
        if: always()
        run: |
          mkdir -p out/flows
          for r in flow/*.xcresult; do
            [ -d "$r" ] || continue
            n=$(basename "$r" .xcresult)
            xcrun xcresulttool export attachments --path "$r" --output-path "out/flows/$n" > /dev/null 2>&1 || true
          done
          cp flow/*.log out/flows/ 2>/dev/null || true
          find out -name "*.png" | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: old-ios-shots
          path: out
