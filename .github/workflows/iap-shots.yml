# 見た目の確認用: シミュレーター(iPhone と iPad)で主な画面を撮って、画像を成果物として保存する。署名もアップロードもしない。
# 手動実行(Actions タブ → UI Screenshots → Run workflow)。バナーはテスト広告で、-force-banner で場所を出す。
name: IAP Screenshots
on: workflow_dispatch
jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Restore Firebase config
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$PLIST" | base64 --decode > DanmakuApp/GoogleService-Info.plist
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild build -project DanmakuMaker.xcodeproj -scheme DanmakuApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO | tail -5
      - name: Take screenshots
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/*.app | head -1)
          BID=com.koshin.danmakumaker
          mkdir -p shots
          pick() { xcrun simctl list devices available | grep "$1" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'; }
          for kind in iPhone; do
            UDID=$(pick "$kind")
            echo "$kind => $UDID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            shot() {  # 名前, 起動引数...
              name=$1; shift
              xcrun simctl terminate "$UDID" $BID || true
              xcrun simctl launch "$UDID" $BID -force-banner "$@"
              sleep 14
              xcrun simctl io "$UDID" screenshot "shots/${kind}_${name}.png"
            }
            shot swipe -open-swipe
            shot swipe_stamina -open-swipe -swipe-stamina-sheet
            xcrun simctl shutdown "$UDID" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
