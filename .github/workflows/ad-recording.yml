# 広告動画の収録(ci/ad-recording ブランチだけ。main には入れない)。
# Firebase エミュレーター(デモの世界のステージ入り)につないだシミュレーターで AdRecordingUITests を動かし、画面収録する。
# 収録した動画・スクショ・時刻の印・ログは、このブランチの ad-recording-output/ にコミットして戻す。
name: Ad recording
on:
  push:
    branches: [ci/ad-recording]
    paths-ignore: [ad-recording-output/**]
permissions:
  contents: write
concurrency:
  group: ad-recording
  cancel-in-progress: true
jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Tools
        run: brew install xcodegen ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare output
        run: mkdir -p "$RUNNER_TEMP/out" && echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
      - name: Functions build
        working-directory: firebase/functions
        run: npm ci --no-audit --no-fund && npm run build
      - name: Start emulators
        working-directory: firebase
        run: |
          npm i -g firebase-tools@14 > /dev/null 2>&1
          nohup firebase emulators:start --only auth,firestore,functions,storage --project demo-danmaku > "$OUT/emulators.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:8080 && curl -s -o /dev/null http://127.0.0.1:9099 && curl -s -o /dev/null http://127.0.0.1:5001; then echo "emulators up after ${i}s"; break; fi
            sleep 2
          done
          sleep 15
          tail -20 "$OUT/emulators.log"
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        run: |
          xcrun simctl list devices available > "$OUT/devices.txt"
          pick() { grep -E "$1" "$OUT/devices.txt" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'; }
          UDID=$(pick "iPhone 17 Pro Max \(")
          [ -z "$UDID" ] && UDID=$(pick "iPhone .*Pro Max \(")
          [ -z "$UDID" ] && UDID=$(pick "iPhone")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          grep "$UDID" "$OUT/devices.txt"
      - name: Build for testing
        run: |
          set -o pipefail
          # 最適化ありのリリース設定でビルドする(デバッグ設定だと描画が間に合わず、収録が1秒11コマ程度になった)。
          # 収録用の仕掛けは #if DEBUG の中なので、DEBUG の印だけ付ける
          xcodebuild build-for-testing -project DanmakuMaker.xcodeproj -scheme DanmakuApp -configuration Release \
            "SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG" \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=-" DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            > "$OUT/build.log" 2>&1 || { grep -E "error:" "$OUT/build.log" | head -60; tail -40 "$OUT/build.log"; exit 1; }
          tail -3 "$OUT/build.log"
      - name: Boot simulator
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          sleep 5
      - name: Record (en, ja)
        run: |
          set +e
          XCR=$(ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun | head -1)
          echo "xctestrun: $XCR"
          for L in en ja; do
            D="$OUT/$L"; mkdir -p "$D"
            # 言語ごとに、サーバーとアプリの状態をまっさらにしてから撮る
            curl -s -X DELETE "http://127.0.0.1:8080/emulator/v1/projects/demo-danmaku/databases/(default)/documents" > /dev/null
            curl -s -X DELETE "http://127.0.0.1:9099/emulator/v1/projects/demo-danmaku/accounts" > /dev/null
            AD_LANG=$L FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 node tools/ad_seed.mjs > "$D/seed.log" 2>&1
            xcrun simctl uninstall "$UDID" com.koshin.danmakumaker > /dev/null 2>&1
            python3 -c 'import time; print(f"{time.time():.3f} rec.start")' > "$D/rec_start.txt"
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$D/rec.mov" > "$D/record.log" 2>&1 &
            REC=$!
            sleep 2
            python3 -c 'import time; print(f"{time.time():.3f} rec.started")' >> "$D/rec_start.txt"
            TEST_RUNNER_AD_DIR="$D" TEST_RUNNER_AD_LANG="$L" xcodebuild test-without-building -xctestrun "$XCR" \
              -destination "platform=iOS Simulator,id=$UDID" \
              -only-testing:DanmakuAppUITests/AdRecordingUITests > "$D/test.log" 2>&1
            echo "test exit $?" >> "$D/test.log"
            kill -INT $REC; wait $REC
            echo "== $L"; tail -5 "$D/test.log"; cat "$D/marks.txt"
          done
      - name: Crash reports
        if: always()
        run: |
          xcrun simctl spawn "$UDID" log show --last 60m --style compact --predicate 'eventMessage CONTAINS "AD-REC" OR eventMessage CONTAINS[c] "keychain"' > "$OUT/applog.txt" 2>&1 || true
          tail -40 "$OUT/applog.txt" || true
          mkdir -p "$OUT/crash"
          find ~/Library/Logs/DiagnosticReports -name "*anmaku*" -mmin -90 -exec cp {} "$OUT/crash/" \; 2>/dev/null || true
          ls "$OUT/crash"
      - name: Compress video
        if: always()
        run: |
          for D in "$OUT"/en "$OUT"/ja; do
            if [ -f "$D/rec.mov" ]; then
              ffmpeg -y -loglevel error -i "$D/rec.mov" -vf "scale=1080:-2" -c:v libx264 -crf 24 -preset veryfast -pix_fmt yuv420p -r 30 -an "$D/rec.mp4"
              ffprobe -v error -show_entries format=duration -of csv=p=0 "$D/rec.mov" > "$D/rec_duration.txt"
              rm "$D/rec.mov"
            fi
          done
          ls -la "$OUT" "$OUT"/en "$OUT"/ja
      - name: Save to branch
        if: always()
        run: |
          rm -rf ad-recording-output && mkdir ad-recording-output
          cp -R "$OUT"/. ad-recording-output/
          tail -400 ad-recording-output/build.log > ad-recording-output/build_tail.log 2>/dev/null || true
          rm -f ad-recording-output/build.log
          find ad-recording-output -size +90M -delete
          git config user.name "ad-recording-bot"
          git config user.email "ad-recording-bot@users.noreply.github.com"
          git add -A ad-recording-output
          git commit -m "Ad recording output (${GITHUB_RUN_ID})" || exit 0
          git push origin HEAD:ci/ad-recording
