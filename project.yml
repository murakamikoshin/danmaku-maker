      - package: AppLovinAdapter
        product: AppLovinAdapterTarget
      - package: UnityAdapter
        product: UnityAdapterTarget
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - package: RevenueCat
        product: RevenueCat
      - package: AppsFlyerLib
        product: AppsFlyerLib
