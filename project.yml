      base:
        # 広告の効果計測(AppsFlyer)。Dev Key が空のあいだは計測なしで動く。キーは AppsFlyer の管理画面で発行
        APPSFLYER_DEV_KEY: "VTHehqvd87knLrpFbaYVeE"
        APPLE_APP_ID: "6824245206"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.koshin.danmakumaker
        DEVELOPMENT_TEAM: 49Q2CLPBWK
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: DanmakuMaker
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_CFBundleDisplayName: 弾幕メーカー
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  DanmakuAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DanmakuAppUITests
    dependencies:
      - target: DanmakuApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DanmakuApp:
    build:
      targets:
        DanmakuApp: all
    test:
      targets:
        - DanmakuAppUITests
