name: DanmakuMaker
options:
  bundleIdPrefix: com.koshin
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
packages:
  DanmakuCore:
    path: DanmakuCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 11.6.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 11.2.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    exactVersion: 2.3.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    exactVersion: 5.69.0
  AppsFlyerLib:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework
    exactVersion: 7.0.4
targets:
  DanmakuApp:
    type: application
    platform: iOS
    sources:
      - DanmakuApp
      # 招待のごほうびの自機(ドット絵)。フォルダのまま入れて、rewards/<ID>/<ID>_<コマ>.png で読む
      - path: art/rewards
        type: folder
        buildPhase: resources
    info:
      path: DanmakuApp/Info.plist
      properties:
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        ADMOB_REWARDED_UNIT_ID: $(ADMOB_REWARDED_UNIT_ID)
        ADMOB_INTERSTITIAL_UNIT_ID: $(ADMOB_INTERSTITIAL_UNIT_ID)
        ADMOB_BANNER_UNIT_ID: $(ADMOB_BANNER_UNIT_ID)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        APPSFLYER_DEV_KEY: $(APPSFLYER_DEV_KEY)
        APPLE_APP_ID: $(APPLE_APP_ID)
        NSUserTrackingUsageDescription: 広告を表示するために使用します。許可しなくても遊べます。
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [DelaGothicOne-Regular.ttf]
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
