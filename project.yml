name: DanmakuMaker
options:
  bundleIdPrefix: com.koshin
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: ja
packages:
  DanmakuCore:
    path: DanmakuCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 11.6.0
  # 広告 SDK。提出用(Xcode 26)は 13。この Mac の Xcode 15.2 では 13 がビルドできないので、
  # tools/build_shots_app.sh が 11.2.0 に差し替え、メディエーションの部品を外す(違いは AdsCompat.swift で吸収)
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 13.12.0
  # メディエーション(AdMob の入札に AppLovin・Unity Ads も参加させて、単価を競わせる)。
  # タグが 13.7.000 のような形で SPM の版として読めないので、タグのコミットで固定する
  AppLovinAdapter:
    url: https://github.com/googleads/googleads-mobile-ios-mediation-applovin
    revision: 5a50776a706e62006135c6ee2dcc70b90c669aee  # 13.7.000(AppLovin SDK 13.7.0)
  UnityAdapter:
    url: https://github.com/googleads/googleads-mobile-ios-mediation-unity
    revision: 188967a5c062987496cd276b83dc25e84f87d9a6  # 4.21.000(Unity Ads 4.21.0)
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    exactVersion: 2.3.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    exactVersion: 5.69.0
  AppsFlyerLib:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework
    exactVersion: 7.0.4
targets:
  DanmakuApp:
    type: application
    platform: iOS
    sources:
      - DanmakuApp
      # 招待のごほうびの自機(ドット絵)。フォルダのまま入れて、rewards/<ID>/<ID>_<コマ>.png で読む
      - path: art/rewards
        type: folder
        buildPhase: resources
    info:
      path: DanmakuApp/Info.plist
      properties:
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        ADMOB_REWARDED_UNIT_ID: $(ADMOB_REWARDED_UNIT_ID)
        ADMOB_INTERSTITIAL_UNIT_ID: $(ADMOB_INTERSTITIAL_UNIT_ID)
        ADMOB_BANNER_UNIT_ID: $(ADMOB_BANNER_UNIT_ID)
        ADMOB_NATIVE_UNIT_ID: $(ADMOB_NATIVE_UNIT_ID)
        ADMOB_MREC_UNIT_ID: $(ADMOB_MREC_UNIT_ID)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        APPSFLYER_DEV_KEY: $(APPSFLYER_DEV_KEY)
        APPLE_APP_ID: $(APPLE_APP_ID)
        NSUserTrackingUsageDescription: 許可すると、あなたに合った広告が表示されやすくなります。許可しなくても、すべての機能で遊べます。
        ITSAppUsesNonExemptEncryption: false
        # 共有ページの「アプリで遊ぶ」から開くための URL(danmakumaker://s/ABCDE)。
        # Universal Links は、同じサイトの中のリンクや転送では働かず、LINE・X などのアプリ内ブラウザでも働かないことが多いため
        CFBundleURLTypes:
          - CFBundleURLName: com.koshin.danmakumaker
            CFBundleURLSchemes: [danmakumaker]
        UIAppFonts: [DelaGothicOne-Regular.ttf]
        # Google・AppLovin・Unity Ads の公式の一覧を合わせたもの(2026-11-12)。メディエーションの各社が入札するのに要る
