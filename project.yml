name: DanmakuMaker
options:
  bundleIdPrefix: com.koshin
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
packages:
  DanmakuCore:
    path: DanmakuCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 11.6.0
targets:
  DanmakuApp:
    type: application
    platform: iOS
    sources:
      - DanmakuApp
    dependencies:
      - package: DanmakuCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koshin.danmakumaker
        PRODUCT_NAME: DanmakuMaker
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: 弾幕メーカー
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  DanmakuAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DanmakuAppUITests
    dependencies:
      - target: DanmakuApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DanmakuApp:
    build:
      targets:
        DanmakuApp: all
    test:
      targets:
        - DanmakuAppUITests
