    entitlements:
      path: DanmakuApp/DanmakuApp.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains:
          - applinks:danmaku-maker.web.app
          - applinks:danmaku-maker.onelink.me
        # 通知(いいね・コメントなど)。App Store 用の書き出しで production に置き換わる
        aps-environment: development
    dependencies:
      - package: DanmakuCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - package: RevenueCat
        product: RevenueCat
      - package: AppsFlyerLib
        product: AppsFlyerLib
    settings:
